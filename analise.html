<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM · Tabela Geral</title><link rel="stylesheet" href="nexo.css"></head>
<body class="app-surface"><header class="topbar"><div class="topbar-inner"><a class="brand" href="inicio.html"><img src="logo/logo_branca.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav"><a href="inicio.html">Início</a><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa</a><a href="analytics.html">Analytics</a><a href="rede-mercados.html">Rede</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header>
<main class="shell" id="app"><div class="loading">Carregando Tabela Geral…</div></main><div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<script src="auth.js"></script><script>
requireCTIUser(['ADMIN','BROKER']);
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app'),modal=document.getElementById('modal');
let enterprise=null,catalog=null,modalityId='',planCode='',query='',statusFilter='',blockFilter='';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const money=value=>Number.isFinite(Number(value))?Number(value).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const date=value=>value?new Date(String(value).length===10?value+'T12:00:00':value).toLocaleDateString('pt-BR'):'—';
const number=value=>Number(value||0).toLocaleString('pt-BR');
const api=async(url,options={})=>{const response=await fetch(url,options),data=await response.json();if(!response.ok){const error=Error(data.error||'Não foi possível concluir a operação.');Object.assign(error,data);throw error}return data};
const statusTag=value=>`<span class="tag ${/vendida/i.test(value||'')?'warn':/dispon/i.test(value||'')?'':'gray'}">${esc(value||'Não identificado')}</span>`;
const statusOptions=(selected='')=>(catalog?.statusOptions||[]).map(status=>`<option value="${esc(status)}" ${status===selected?'selected':''}>${esc(status)}</option>`).join('');
function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}
function filteredUnits(){return(catalog?.unidades||[]).filter(unit=>{const term=`${unit.bloco||''} ${unit.unidade||''} ${unit.descricaoExtraida||''}`.toLowerCase();return(!query||term.includes(query.toLowerCase()))&&(!statusFilter||unit.situacaoComercial===statusFilter)&&(!blockFilter||unit.bloco===blockFilter)}).sort((a,b)=>`${a.bloco} ${a.unidade}`.localeCompare(`${b.bloco} ${b.unidade}`,'pt-BR',{numeric:true}))}
function componentCell(plan,id){const item=(plan.componentes||[]).find(component=>component.id===id);if(!item||!Number(item.quantidade))return'—';const quantity=Number(item.quantidade||1),value=Number(item.valor);return quantity>1?`${quantity} × ${money(value)}`:money(item.total??value)}
async function openCommercialView(){
  const plans=catalog?.planos||[];if(!catalog?.versao)return alert('Não há fotografia confirmada nesta modalidade.');
  modal.innerHTML=`<section class="modal-box commercial-view-modal"><div class="modal-head"><div><div class="eyebrow">Visualização derivada</div><h2>Gerar tabela comercial</h2><p>${esc(catalog.modalidade?.label||'Modalidade')} · ${esc(catalog.versao.name)} · ${date(catalog.versao.validityDate)}</p></div><button class="button ghost" data-close>Fechar</button></div><div class="modal-body"><section class="commercial-plan-picker"><div><strong>Planos exibidos</strong><span>A seleção não cria nem altera uma fotografia.</span></div><div>${plans.length?plans.map(plan=>`<label><input type="checkbox" data-generated-plan="${esc(plan.codigo)}" ${plan.codigo===planCode?'checked':''}><span>${esc(plan.nome)}</span></label>`).join(''):'<span>Esta modalidade não possui planos estruturados.</span>'}</div><button class="button teal" id="generate-commercial" ${plans.length?'':'disabled'}>Gerar tabela</button></section><div id="generated-commercial-host"></div></div></section>`;modal.classList.remove('hidden');modal.querySelector('[data-close]').onclick=closeModal;
  const generate=async()=>{const selected=[...modal.querySelectorAll('[data-generated-plan]:checked')].map(input=>input.dataset.generatedPlan);if(!selected.length)return alert('Selecione ao menos um plano.');const view=await api(`/api/empreendimentos/${encodeURIComponent(id)}/tabelas/${encodeURIComponent(catalog.versao.id)}/visualizacao-comercial?planos=${encodeURIComponent(selected.join(','))}`);document.getElementById('generated-commercial-host').innerHTML=`<div class="commercial-table-wrap generated-commercial-table"><table class="commercial-table"><thead><tr><th>Unidade</th><th>Valor do imóvel</th>${view.planos.map(plan=>`<th>${esc(plan.nome)}</th>`).join('')}</tr></thead><tbody>${view.rows.map(row=>`<tr><td><strong>${esc(row.quadra)} · ${esc(row.unidade)}</strong><small>${esc(row.situacao)}</small></td><td>${money(row.valorImovel)}</td>${row.planos.map(plan=>`<td><div class="generated-plan-components"><span>Entrada <b>${componentCell(plan,'entrada')}</b></span><span>Intercalada <b>${componentCell(plan,'intercaladas')}</b></span><span>Mensais <b>${componentCell(plan,'mensais')}</b></span><span>Chave <b>${componentCell(plan,'chave')}</b></span><em class="${plan.status==='conforme'?'is-ok':'is-critical'}">${plan.status==='conforme'?'Conciliado':'Revisar'}</em></div></td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
  document.getElementById('generate-commercial').onclick=generate;if(plans.length)generate();
}
async function openHistory(key){
  const unit=(catalog?.unidades||[]).find(item=>item.chave===key);if(!unit)return;const history=await api(`/api/empreendimentos/${encodeURIComponent(id)}/historico?unidade=${encodeURIComponent(key)}`);const events=history.fatos||[];
  modal.innerHTML=`<section class="modal-box unit-modal"><div class="modal-head"><div><div class="eyebrow">${esc(unit.bloco||'Sem bloco')}</div><h2>Unidade ${esc(unit.unidade)}</h2><p>Publicado, consolidado e histórico permanecem separados.</p></div><button class="button ghost" data-close>Fechar</button></div><div class="modal-body"><div class="unit-detail-grid"><div><span>Situação consolidada</span><strong>${esc(unit.situacaoComercial)}</strong></div><div><span>Valor na modalidade</span><strong>${money(unit.valorModalidade)}</strong></div><div><span>Fotografia comercial</span><strong>${esc(unit.tabelaModalidadeId||'—')}</strong></div><div><span>Origem estrutural</span><strong>${esc(unit.origemEstruturalTabelaId||'—')}</strong></div></div><h3>Fatos históricos</h3><div class="table-wrap"><table><thead><tr><th>Data</th><th>Fato</th><th>Anterior</th><th>Atual</th><th>Tabelas</th></tr></thead><tbody>${events.length?events.map(event=>`<tr><td>${date(event.dataValidade)}</td><td><strong>${esc(event.tipo.replaceAll('_',' '))}</strong></td><td>${event.valorAnterior!=null?money(event.valorAnterior):esc(event.statusAnterior||'—')}</td><td>${event.valorAtual!=null?money(event.valorAtual):esc(event.statusAtual||'—')}</td><td>${esc(event.tabelaAnteriorId||'início')} → ${esc(event.tabelaAtualId)}</td></tr>`).join(''):'<tr><td colspan="5">Sem fatos para esta unidade.</td></tr>'}</tbody></table></div></div></section>`;modal.classList.remove('hidden');modal.querySelector('[data-close]').onclick=closeModal;
}
function render(){
  const units=catalog?.unidades||[],metrics=catalog?.metricas||{},shown=filteredUnits(),blocks=[...new Set(units.map(unit=>unit.bloco).filter(Boolean))].sort(),hotPoints=(enterprise?.pontosQuentes||[]).filter(point=>point.status==='aberto');
  app.innerHTML=`<section class="page-head"><div><div class="eyebrow">Cadastro consolidado</div><h1>Tabela Geral · ${esc(enterprise.nome)}</h1><p>Unidades, estoque e valor no contexto comercial selecionado.</p></div><div class="actions"><a class="button ghost" href="empreendimento.html?id=${encodeURIComponent(id)}">Histórico comercial</a><a class="button ghost" href="analytics.html?id=${encodeURIComponent(id)}">Radar histórico</a></div></section><section class="card section general-commercial-context"><div class="section-title"><div><h2>Forma de pagamento</h2><p>A tabela base organiza a estrutura; a última fotografia confirmada da modalidade fornece os valores.</p></div><button class="button teal" id="open-commercial-view">Visualizar tabela</button></div><div class="general-commercial-selectors"><label>Modalidade<select id="general-modality">${(catalog.modalidades||[]).map(item=>`<option value="${esc(item.id)}" ${item.id===catalog.modalidade?.id?'selected':''}>${esc(item.label)}</option>`).join('')}</select></label><label>Plano<select id="general-plan" ${catalog.planos?.length?'':'disabled'}>${(catalog.planos||[]).map(item=>`<option value="${esc(item.codigo)}" ${item.codigo===catalog.plano?.codigo?'selected':''}>${esc(item.nome)}</option>`).join('')||'<option>Condição publicada</option>'}</select></label><div><span>Versão vigente</span><strong>${esc(catalog.versao?.name||'Sem versão')}</strong><small>${date(catalog.versao?.validityDate)} · ${esc(catalog.versao?.id||'—')}</small></div><div><span>Tabela base</span><strong>${esc(catalog.tabelaBase?.name||'Não definida')}</strong><small>${esc(catalog.tabelaBase?.id||'—')}</small></div></div></section><section class="metrics general-inventory-metrics"><article class="metric accent"><strong>${number(metrics.total)}</strong><span>Total</span></article><article class="metric positive"><strong>${number(metrics.disponiveis)}</strong><span>Disponíveis</span></article><article class="metric"><strong>${number(metrics.reservadas)}</strong><span>Reservadas</span></article><article class="metric negative"><strong>${number(metrics.vendidas)}</strong><span>Vendidas</span></article><article class="metric"><strong>${number(metrics.bloqueadas)}</strong><span>Bloqueadas</span></article><article class="metric warning"><strong>${number(metrics.ausentesRevisao)}</strong><span>Ausentes / revisão</span></article><article class="metric"><strong>${money(metrics.ticketDisponivel)}</strong><span>Ticket disponível</span></article></section>${hotPoints.length?`<section class="card section central-hot-points"><div class="section-title"><div><h2>Ausências aguardando decisão</h2><p>Ausência não é venda automática.</p></div></div><div class="review-bulk"><div><strong>${number(hotPoints.length)} unidade${hotPoints.length===1?'':'s'}</strong><span>Confirme em massa somente quando houver evidência operacional.</span></div><div class="review-bulk-actions"><button class="review-filter" id="hot-all">Selecionar todas</button><label>Alterar para<select id="hot-status">${statusOptions('Vendida')}</select></label><button class="button teal" id="hot-apply">Confirmar</button></div></div><div class="table-wrap"><table><thead><tr><th></th><th>Bloco</th><th>Unidade</th><th>Situação anterior</th><th>Fotografia</th></tr></thead><tbody>${hotPoints.map(point=>`<tr><td><input type="checkbox" data-hot="${esc(point.id)}"></td><td>${esc(point.bloco)}</td><td><strong>${esc(point.unidade)}</strong></td><td>${statusTag(point.situacaoAnterior)}</td><td>${esc(point.tabelaId)}</td></tr>`).join('')}</tbody></table></div></section>`:''}<section class="card section general-units-card"><div class="section-title"><div><h2>Unidades consolidadas</h2><p>Clique em uma unidade para abrir preço, status e fatos históricos.</p></div></div><div class="review-toolbar central-filters"><label>Buscar</label><input id="central-search" type="search" value="${esc(query)}" placeholder="Bloco, unidade ou tipologia"><label>Situação</label><select id="central-status"><option value="">Todas</option>${statusOptions(statusFilter)}</select><label>Bloco</label><select id="central-block"><option value="">Todos</option>${blocks.map(block=>`<option value="${esc(block)}" ${block===blockFilter?'selected':''}>${esc(block)}</option>`).join('')}</select><small>${number(shown.length)} exibidas</small></div><div class="review-bulk"><div><strong>Atualização operacional</strong><span>O ajuste não reescreve a fotografia publicada.</span></div><div class="review-bulk-actions"><button class="review-filter" id="unit-all">Selecionar exibidas</button><label>Alterar para<select id="unit-status">${statusOptions('Disponível')}</select></label><button class="button teal" id="unit-apply">Salvar situações</button></div></div><div class="table-wrap general-units-table"><table><thead><tr><th></th><th>Bloco</th><th>Unidade</th><th>Tipologia</th><th>Situação consolidada</th><th>Revisão</th><th class="num">Área</th><th class="num">Valor · ${esc(catalog.modalidade?.label||'modalidade')}</th><th>Plano</th></tr></thead><tbody>${shown.length?shown.map(unit=>`<tr data-unit-row="${esc(unit.chave)}"><td><input type="checkbox" data-unit="${esc(unit.chave)}"></td><td>${esc(unit.bloco||'—')}</td><td><strong>${esc(unit.unidade)}</strong></td><td>${esc(unit.descricaoExtraida||'—')}</td><td>${statusTag(unit.situacaoComercial)}</td><td>${unit.emRevisao?'<span class="tag warn">Ausente / revisar</span>':'—'}</td><td class="num">${unit.areaPrivativa?String(unit.areaPrivativa).replace('.',',')+' m²':'—'}</td><td class="num"><strong>${money(unit.valorModalidade)}</strong><small>${unit.valorPublicado!=null?'Publicado '+money(unit.valorPublicado):''}</small></td><td>${esc(catalog.plano?.nome||'Condição publicada')}</td></tr>`).join(''):'<tr><td colspan="9">Nenhuma unidade encontrada.</td></tr>'}</tbody></table></div></section>`;
  document.getElementById('general-modality').onchange=event=>{modalityId=event.target.value;planCode='';loadCatalog()};document.getElementById('general-plan').onchange=event=>{planCode=event.target.value;loadCatalog()};document.getElementById('open-commercial-view').onclick=openCommercialView;
  document.getElementById('central-search').oninput=event=>{query=event.target.value;render()};document.getElementById('central-status').onchange=event=>{statusFilter=event.target.value;render()};document.getElementById('central-block').onchange=event=>{blockFilter=event.target.value;render()};
  document.getElementById('hot-all')?.addEventListener('click',()=>document.querySelectorAll('[data-hot]').forEach(input=>input.checked=true));document.getElementById('hot-apply')?.addEventListener('click',async()=>{const ids=[...document.querySelectorAll('[data-hot]:checked')].map(input=>input.dataset.hot);if(!ids.length)return alert('Selecione ao menos uma unidade.');await api(`/api/empreendimentos/${encodeURIComponent(id)}/pontos-quentes/aprovar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,situacao:document.getElementById('hot-status').value})});await load()});
  document.getElementById('unit-all').onclick=()=>document.querySelectorAll('[data-unit]').forEach(input=>input.checked=true);document.getElementById('unit-apply').onclick=async()=>{const situacoes=[...document.querySelectorAll('[data-unit]:checked')].map(input=>({chave:input.dataset.unit,situacao:document.getElementById('unit-status').value}));if(!situacoes.length)return alert('Selecione ao menos uma unidade.');await api(`/api/empreendimentos/${encodeURIComponent(id)}/unidades/situacoes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({situacoes})});await load()};document.querySelectorAll('[data-unit-row]').forEach(row=>row.onclick=event=>{if(!event.target.closest('input'))openHistory(row.dataset.unitRow)});
}
async function loadCatalog(){const params=new URLSearchParams();if(modalityId)params.set('modalidade',modalityId);if(planCode)params.set('plano',planCode);catalog=await api(`/api/empreendimentos/${encodeURIComponent(id)}/unidades?${params}`);modalityId=catalog.modalidade?.id||'';planCode=catalog.plano?.codigo||'';render()}
async function load(){try{const params=new URLSearchParams();if(modalityId)params.set('modalidade',modalityId);if(planCode)params.set('plano',planCode);const [summary,catalogData]=await Promise.all([api(`/api/empreendimentos/${encodeURIComponent(id)}?resumo=1`),api(`/api/empreendimentos/${encodeURIComponent(id)}/unidades?${params}`)]);enterprise=summary;catalog=catalogData;modalityId=catalog.modalidade?.id||'';planCode=catalog.plano?.codigo||'';render()}catch(error){app.innerHTML=`<div class="notice error">${esc(error.message)}</div>`}}
if(!id)app.innerHTML='<div class="notice error">Selecione um empreendimento.</div>';else load();
</script></body></html>
