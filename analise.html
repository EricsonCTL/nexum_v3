<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Radar · Leitura de unidades</title><link rel="stylesheet" href="nexo.css"></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="empreendimentos.html"><img src="logo/ChatGPT%20Image%2013%20de%20ago.%20de%202026,%2011_38_17.png" alt="Nexo Radar Imobiliário"></a><nav class="nav"><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa Radar</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header>
<main class="shell" id="app"><div class="loading">Carregando unidades…</div></main><div id="modal" class="modal hidden"></div>
<script src="auth.js"></script><script>
requireCTIUser(['ADMIN','BROKER']);
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app'),modal=document.getElementById('modal');let emp=null,selectedType='';
const api=async(url)=>{const r=await fetch(url);const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível concluir a operação.');return d};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>v==null?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';const number=v=>Number(v||0).toLocaleString('pt-BR');
const value=u=>u.valorValidado??u.valorInterpretado??u.valorExtraido??null;const key=u=>u.chave||`${u.quadra}:${u.unidade}`;
function tableSet(){const tables=(emp.tabelas||[]).filter(t=>t.status==='registered').sort((a,b)=>a.validityDate.localeCompare(b.validityDate)||a.createdAt.localeCompare(b.createdAt));const types=[...new Map(tables.map(t=>[t.tipoTabela||'PADRAO',t.tipoTabelaLabel||'Padrão'])).entries()].map(([id,label])=>({id,label}));if(!selectedType)selectedType=types.at(-1)?.id||'';const scope=tables.filter(t=>(t.tipoTabela||'PADRAO')===selectedType);return {tables,types,current:scope.at(-1)||null,previous:scope.at(-2)||null};}
function statusTag(status){const text=status||'Não identificado';const cls=/dispon/i.test(text)?'':'gray';return `<span class="tag ${cls}">${esc(text)}</span>`}
function render(){const {tables,types,current,previous}=tableSet();if(!tables.length){app.innerHTML='<div class="empty">Ainda não há tabela confirmada para análise.</div>';return}if(!current){app.innerHTML='<div class="empty">Não há versão confirmada para este tipo de tabela.</div>';return}const before=new Map((previous?.unidades||[]).map(u=>[key(u),u]));const rows=(current.unidades||[]).map(u=>{const old=before.get(key(u)),now=value(u),prior=old?value(old):null,delta=old&&now!=null&&prior!=null?now-prior:null;return {...u,old,delta,deltaPct:delta!=null&&prior?delta/prior:null}});const changes=rows.filter(r=>r.delta!=null&&r.delta!==0).length;const removed=(previous?.unidades||[]).filter(u=>!(current.unidades||[]).some(n=>key(n)===key(u))).length;
app.innerHTML=`<div class="page-head"><div><div class="eyebrow">Leitura comercial</div><h1>${esc(emp.nome)}</h1><p>${previous?`${esc(previous.name)} · ${date(previous.validityDate)} → ${esc(current.name)} · ${date(current.validityDate)}`:'A primeira versão confirmada não possui comparação anterior.'}</p></div><div class="actions"><a class="button ghost" href="empreendimento.html?id=${encodeURIComponent(id)}">Cadastro</a><a class="button teal" href="simulador.html?id=${encodeURIComponent(id)}">Simular proposta</a></div></div><section class="card section unit-command"><div class="field"><label for="type">Tipo de tabela</label><select id="type">${types.map(t=>`<option value="${esc(t.id)}" ${selectedType===t.id?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div><div><strong>${esc(current.name)}</strong><br><span class="meta">Versão vigente · ${date(current.validityDate)} · ${number(rows.length)} unidades</span></div></section><section class="metrics unit-metrics"><article class="metric"><strong>${number(rows.length)}</strong><span>Unidades nesta versão</span></article><article class="metric"><strong>${money(rows.reduce((s,u)=>s+(Number(value(u))||0),0))}</strong><span>VGV da versão</span></article>${previous?`<article class="metric ${changes?'accent':''}"><strong>${number(changes)}</strong><span>Preços alterados</span></article><article class="metric"><strong>${number(removed)}</strong><span>Saídas vs. anterior</span></article>`:''}</section><section class="card section"><div class="section-title"><div><h2>Unidades da tabela atual</h2><p>Clique em uma unidade para abrir seus detalhes e iniciar a simulação.</p></div>${previous?'<span class="tag">Variação comparada na mesma modalidade</span>':''}</div><div class="unit-board">${rows.map((u,index)=>`<button class="unit-tile ${/dispon/i.test(u.situacaoExtraida||'')?'available':''}" data-index="${index}"><span>${esc(u.quadra||'Sem bloco')}</span><strong>${esc(u.unidade)}</strong><em>${u.areaPrivativa?`${String(u.areaPrivativa).replace('.',',')} m²`:'Área não informada'}</em><b>${money(value(u))}</b>${previous?`<i class="${u.delta>0?'up':u.delta<0?'down':''}">${u.delta==null?'Nova/unidade sem base':`${u.delta>0?'▲':u.delta<0?'▼':'•'} ${money(Math.abs(u.delta))}`}</i>`:''}${statusTag(u.situacaoExtraida)}</button>`).join('')}</div></section>`;document.getElementById('type').onchange=e=>{selectedType=e.target.value;render()};document.querySelectorAll('.unit-tile').forEach(btn=>btn.onclick=()=>openUnit(rows[Number(btn.dataset.index)],current,previous));}
function openUnit(unit,current,previous){const c=unit.condicoes||{},parts=[];if(c.sinal)parts.push(`<div><span>Sinal</span><strong>${money(c.sinal.valor)}${c.sinal.percentual!=null?` · ${c.sinal.percentual}%`:''}</strong></div>`);if(c.parcelas)parts.push(`<div><span>Parcelas</span><strong>${c.parcelas.quantidade||'—'}× de ${money(c.parcelas.valor)}</strong></div>`);if(c.intercaladas)parts.push(`<div><span>Intercaladas</span><strong>${c.intercaladas.quantidade||'—'}× de ${money(c.intercaladas.valor)}</strong></div>`);if(c.chave)parts.push(`<div><span>Chave</span><strong>${money(c.chave.valor)}${c.chave.percentual!=null?` · ${c.chave.percentual}%`:''}</strong></div>`);modal.classList.remove('hidden');modal.innerHTML=`<div class="modal-box unit-modal"><div class="modal-head"><div><div class="eyebrow">${esc(unit.quadra||'Sem bloco')}</div><h2>Unidade ${esc(unit.unidade)}</h2></div><button class="button ghost" id="close">Fechar</button></div><div class="unit-detail-grid"><div><span>Valor da versão</span><strong>${money(value(unit))}</strong></div><div><span>Área privativa</span><strong>${unit.areaPrivativa?`${String(unit.areaPrivativa).replace('.',',')} m²`:'—'}</strong></div><div><span>Vagas</span><strong>${unit.vagas??'—'}</strong></div><div><span>Situação no PDF</span>${statusTag(unit.situacaoExtraida)}</div>${previous?`<div><span>Variação</span><strong>${unit.delta==null?'Sem base':`${unit.delta>0?'▲':unit.delta<0?'▼':'•'} ${money(Math.abs(unit.delta))}`}</strong></div>`:''}</div>${parts.length?`<h3>Condição comercial desta unidade</h3><div class="unit-detail-grid">${parts.join('')}</div>`:`<p class="notice">A tabela não trouxe uma composição por unidade. Consulte as regras comerciais gerais.</p>`}<div class="form-footer"><a class="button teal" href="simulador.html?id=${encodeURIComponent(id)}&tipo=${encodeURIComponent(current.tipoTabela||'PADRAO')}&tabela=${encodeURIComponent(current.id)}&unidade=${encodeURIComponent(unit.id)}">Simular esta unidade</a></div></div>`;document.getElementById('close').onclick=()=>modal.classList.add('hidden');}
let selectedBlock='';
function render(){const {tables,types,current,previous}=tableSet();if(!tables.length){app.innerHTML='<div class="empty">Ainda não há tabela confirmada para análise.</div>';return}if(!current){app.innerHTML='<div class="empty">Não há versão confirmada para esta modalidade.</div>';return}const before=new Map((previous?.unidades||[]).map(u=>[key(u),u]));const rows=(current.unidades||[]).map(u=>{const old=before.get(key(u)),now=value(u),prior=old?value(old):null,delta=old&&now!=null&&prior!=null?now-prior:null;return {...u,old,delta,deltaPct:delta!=null&&prior?delta/prior:null}});const blocks=[...new Set(rows.map(u=>u.quadra||'Sem bloco'))].sort();if(selectedBlock&&!blocks.includes(selectedBlock))selectedBlock='';const shown=selectedBlock?rows.filter(u=>(u.quadra||'Sem bloco')===selectedBlock):rows;const changes=rows.filter(r=>r.delta!=null&&r.delta!==0).length;const removed=(previous?.unidades||[]).filter(u=>!rows.some(n=>key(n)===key(u))).length;const hasValuation=rows.some(u=>u.valorAvaliacaoExtraido!=null);app.innerHTML=`<div class="page-head"><div><div class="eyebrow">Leitura comercial</div><h1>${esc(emp.nome)}</h1><p>${previous?`${esc(previous.name)} · ${date(previous.validityDate)} → ${esc(current.name)} · ${date(current.validityDate)}`:'A primeira versão confirmada não possui comparação anterior.'}</p></div><div class="actions"><a class="button ghost" href="empreendimento.html?id=${encodeURIComponent(id)}">Cadastro</a><a class="button teal" href="simulador.html?id=${encodeURIComponent(id)}">Simular proposta</a></div></div><section class="card section unit-command"><div class="field"><label for="type">Modalidade comercial</label><select id="type">${types.map(t=>`<option value="${esc(t.id)}" ${selectedType===t.id?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div><div><strong>${esc(current.name)}</strong><br><span class="meta">Versão vigente · ${date(current.validityDate)} · ${number(rows.length)} unidades</span></div></section><section class="metrics unit-metrics"><article class="metric"><strong>${number(rows.length)}</strong><span>Unidades nesta versão</span></article><article class="metric"><strong>${money(rows.reduce((s,u)=>s+(Number(value(u))||0),0))}</strong><span>VGV · preço do imóvel</span></article>${previous?`<article class="metric ${changes?'accent':''}"><strong>${number(changes)}</strong><span>Preços alterados</span></article><article class="metric"><strong>${number(removed)}</strong><span>Saídas para classificar</span></article>`:''}</section><section class="card section quintas-units"><div class="section-title"><div><h2>Unidades da tabela atual</h2><p>Preço do imóvel orienta VGV e variação. Clique na linha para abrir as condições comerciais.</p></div>${previous?'<span class="tag">Variação na mesma modalidade</span>':''}</div><div class="unit-filter-row"><span>Bloco:</span><button class="unit-filter ${!selectedBlock?'active':''}" data-block="">Todos</button>${blocks.map(block=>`<button class="unit-filter ${selectedBlock===block?'active':''}" data-block="${esc(block)}">${esc(block)}</button>`).join('')}<small>${number(shown.length)} exibidas</small></div><div class="table-wrap quintas-table"><table><thead><tr><th>Bloco</th><th>Unidade</th><th class="num">Área</th><th>Situação</th><th class="num">Preço do imóvel</th>${hasValuation?'<th class="num">Avaliação Caixa</th>':''}${previous?'<th class="num">Variação</th>':''}</tr></thead><tbody>${shown.map((u,index)=>`<tr class="unit-row" data-index="${rows.indexOf(u)}"><td><span class="block-pill">${esc(u.quadra||'Sem bloco')}</span></td><td><strong>${esc(u.unidade)}</strong></td><td class="num">${u.areaPrivativa?`${String(u.areaPrivativa).replace('.',',')} m²`:'—'}</td><td>${statusTag(u.situacaoExtraida)}</td><td class="num"><strong>${money(value(u))}</strong></td>${hasValuation?`<td class="num">${money(u.valorAvaliacaoExtraido)}</td>`:''}${previous?`<td class="num ${u.delta>0?'delta-up':u.delta<0?'delta-down':''}">${u.delta==null?'—':`${u.delta>0?'▲':u.delta<0?'▼':'•'} ${money(Math.abs(u.delta))}`}</td>`:''}</tr>`).join('')}</tbody></table></div></section>`;document.getElementById('type').onchange=e=>{selectedType=e.target.value;selectedBlock='';render()};document.querySelectorAll('.unit-filter').forEach(button=>button.onclick=()=>{selectedBlock=button.dataset.block;render()});document.querySelectorAll('.unit-row').forEach(row=>row.onclick=()=>openUnit(rows[Number(row.dataset.index)],current,previous));}
function openUnit(unit,current,previous){const c=unit.condicoes||{},parts=[];if(c.sinal)parts.push(`<div><span>Sinal</span><strong>${money(c.sinal.valor)}${c.sinal.percentual!=null?` · ${c.sinal.percentual}%`:''}</strong></div>`);if(c.parcelas)parts.push(`<div><span>Parcelas</span><strong>${c.parcelas.quantidade||'—'}× de ${money(c.parcelas.valor)}</strong></div>`);if(c.intercaladas)parts.push(`<div><span>Intercaladas</span><strong>${c.intercaladas.quantidade||'—'}× de ${money(c.intercaladas.valor)}</strong></div>`);if(c.chave)parts.push(`<div><span>Chave</span><strong>${money(c.chave.valor)}${c.chave.percentual!=null?` · ${c.chave.percentual}%`:''}</strong></div>`);const old=(previous?.unidades||[]).find(u=>key(u)===key(unit)),delta=old&&value(unit)!=null&&value(old)!=null?value(unit)-value(old):null;modal.classList.remove('hidden');modal.innerHTML=`<div class="modal-box unit-modal"><div class="modal-head"><div><div class="eyebrow">${esc(unit.quadra||'Sem bloco')}</div><h2>Unidade ${esc(unit.unidade)}</h2></div><button class="button ghost" id="close">Fechar</button></div><div class="unit-detail-grid"><div><span>Preço do imóvel</span><strong>${money(value(unit))}</strong></div>${unit.valorAvaliacaoExtraido!=null?`<div><span>Avaliação Caixa</span><strong>${money(unit.valorAvaliacaoExtraido)}</strong></div>`:''}<div><span>Área privativa</span><strong>${unit.areaPrivativa?`${String(unit.areaPrivativa).replace('.',',')} m²`:'—'}</strong></div><div><span>Vagas</span><strong>${unit.vagas??'—'}</strong></div><div><span>Situação no PDF</span>${statusTag(unit.situacaoExtraida)}</div>${previous?`<div><span>Variação do preço</span><strong>${delta==null?'Sem base':`${delta>0?'▲':delta<0?'▼':'•'} ${money(Math.abs(delta))}`}</strong></div>`:''}</div>${parts.length?`<h3>Condição comercial desta unidade</h3><div class="unit-detail-grid">${parts.join('')}</div>`:`<p class="notice">A tabela não trouxe uma composição por unidade. Consulte as regras comerciais gerais.</p>`}<div class="form-footer"><a class="button teal" href="simulador.html?id=${encodeURIComponent(id)}&tipo=${encodeURIComponent(current.tipoTabela||'PADRAO')}&tabela=${encodeURIComponent(current.id)}&unidade=${encodeURIComponent(unit.id)}">Simular esta unidade</a></div></div>`;document.getElementById('close').onclick=()=>modal.classList.add('hidden');}
(async()=>{if(!id){app.innerHTML='<div class="error">Selecione um empreendimento.</div>';return}try{emp=await api(`/api/empreendimentos/${encodeURIComponent(id)}`);render()}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`}})();
</script></body></html>
