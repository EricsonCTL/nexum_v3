<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexo Radar Imobiliário · Cadastro</title><link rel="stylesheet" href="nexo.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="empreendimentos.html"><img src="logo/ChatGPT%20Image%2013%20de%20ago.%20de%202026,%2011_38_17.png" alt="Nexo Radar Imobiliário"></a>
    <nav class="nav"><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa Radar</a><button type="button" onclick="logoutCTI()">Sair</button></nav>
  </div></header>
  <main class="shell" id="app"><div class="loading">Carregando cadastro…</div></main>
  <div id="modal" class="modal hidden"></div>
  <script src="auth.js"></script>
  <script>
    requireCTIUser(['ADMIN']);
    const app = document.getElementById('app');
    const modal = document.getElementById('modal');
    const id = new URLSearchParams(location.search).get('id');
    let empreendimento = null;
    const fieldNames = ['nome','construtora','endereco','numero','complemento','bairro','cidade','estado','cep','tipo','padrao','formasPagamento','caracteristicasComerciais','informacoesEstruturais','observacoes'];
    const api = async (url, options = {}) => { const r = await fetch(url, options); const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Não foi possível concluir a operação.'); return data; };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[char]));
    const brDate = value => value ? new Date(value + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
    const money = value => value == null ? '—' : Number(value).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
    const input = (name, label, value = '', type = 'text', wide = '') => `<div class="field ${wide}"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}"></div>`;
    const textarea = (name, label, value = '', wide = 'full') => `<div class="field ${wide}"><label for="${name}">${label}</label><textarea id="${name}" name="${name}">${esc(value)}</textarea></div>`;
    const select = (name, label, value, values) => `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${values.map(item => `<option value="${item}" ${item === value ? 'selected' : ''}>${item}</option>`).join('')}</select></div>`;

    function pageHead() {
      return `<div class="page-head"><div><div class="eyebrow">Cadastro estrutural</div><h1>${id ? esc(empreendimento.nome) : 'Novo empreendimento'}</h1><p>${id ? 'Registre informações, inclua novas tabelas e preserve cada versão comercial.' : 'A origem do histórico começa aqui. Os campos podem evoluir sem reestruturar as tabelas cadastradas.'}</p></div><a class="button ghost" href="empreendimentos.html">← Voltar</a></div>`;
    }
    function form() {
      const e = empreendimento || {};
      return `<section class="card section"><form id="emp-form"><div class="form-grid">
        ${input('nome','Nome do empreendimento',e.nome)}${input('construtora','Construtora / incorporadora',e.construtora)}${input('endereco','Endereço',e.endereco)}${input('numero','Número',e.numero)}
        ${input('complemento','Complemento',e.complemento)}${input('bairro','Bairro',e.bairro)}${input('cidade','Cidade',e.cidade)}
        ${input('estado','Estado',e.estado)}${input('cep','CEP',e.cep)}${input('latitude','Latitude',e.latitude,'number')}${input('longitude','Longitude',e.longitude,'number')}
        ${select('tipo','Tipo de empreendimento',e.tipo || 'Outro',['Loteamento','Apartamento','Casa','Sala comercial','Terreno','Outro'])}
        ${select('padrao','Padrão',e.padrao || 'Outro',['Minha Casa Minha Vida','Econômico','Médio padrão','Alto padrão','Luxo','Outro'])}
        ${textarea('formasPagamento','Formas de pagamento',e.formasPagamento)}${textarea('caracteristicasComerciais','Características comerciais',e.caracteristicasComerciais)}
        ${textarea('informacoesEstruturais','Informações estruturais',e.informacoesEstruturais)}${textarea('observacoes','Observações',e.observacoes)}
      </div><div id="form-message" class="hidden"></div><div class="form-footer"><a class="button ghost" href="empreendimentos.html">Cancelar</a><button class="button teal" type="submit">${id ? 'Salvar alterações' : 'Criar empreendimento'}</button></div></form></section>`;
    }
    function history(tables) {
      return `<section id="history" class="card section hidden"><div class="notice">Uma nova tabela nunca substitui a anterior. A modalidade comercial é editável para manter as versões comparáveis; o PDF permanece como fonte documental.</div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Validade</th><th>Tabela</th><th>Modalidade</th><th>Status</th><th>Unidades</th><th>Documento</th><th></th></tr></thead><tbody>${tables.length ? tables.map(t => `<tr><td>${brDate(t.validityDate)}</td><td><strong>${esc(t.name)}</strong><br><span class="meta">${esc(t.id)}</span></td><td>${esc(t.tipoTabelaLabel || 'Padrão')}</td><td><span class="tag ${t.status === 'registered' ? '' : 'warn'}">${t.status === 'registered' ? 'Cadastrada' : 'Validação pendente'}</span></td><td>${t.unidades?.length || 0}</td><td>${t.documento ? `<a href="${esc(t.documento.path)}" target="_blank">Abrir PDF</a>` : '—'}</td><td><button class="button ghost modalidade" data-id="${t.id}">Modalidade</button><button class="button ghost review" data-id="${t.id}">Revisar</button>${t.status === 'pending_validation' ? `<button class="button ghost reprocess" data-id="${t.id}">Reprocessar</button>` : ''}</td></tr>`).join('') : '<tr><td colspan="7">Nenhuma tabela cadastrada.</td></tr>'}</tbody></table></div><div class="form-footer"><button class="button teal add-table" type="button">+ Adicionar nova tabela</button></div></section>`;
    }
    function details() {
      const tables = [...(empreendimento.tabelas || [])].sort((a,b) => b.validityDate.localeCompare(a.validityDate));
      const address = [empreendimento.endereco,empreendimento.numero,empreendimento.complemento,empreendimento.bairro,empreendimento.cidade,empreendimento.estado,empreendimento.cep].filter(Boolean).join(' · ');
      return `<section class="detail-head"><div class="eyebrow">${esc(empreendimento.id)} · ${esc(empreendimento.tipo)} · ${esc(empreendimento.padrao)}</div><h1>${esc(empreendimento.nome)}</h1><p>${esc(address || 'Localização não informada')}</p></section><div class="detail-tabs"><button class="active" data-tab="info">Informações</button><button data-tab="history">Histórico de tabelas (${tables.length})</button></div><section id="info" class="card section"><div class="info-list"><div><span>Construtora / incorporadora</span>${esc(empreendimento.construtora || 'Não informada')}</div><div><span>Localização</span>${esc(address || 'Não informada')}</div><div><span>Características</span>${esc(`${empreendimento.tipo} · ${empreendimento.padrao}`)}</div><div><span>Formas de pagamento</span>${esc(empreendimento.formasPagamento || 'Não informado')}</div><div><span>Características comerciais</span>${esc(empreendimento.caracteristicasComerciais || 'Não informado')}</div></div><div class="form-footer"><a class="button ghost" href="analise.html?id=${encodeURIComponent(empreendimento.id)}">Unidades e variações</a><a class="button ghost" href="simulador.html?id=${encodeURIComponent(empreendimento.id)}">Simular proposta</a><button class="button primary" id="edit" type="button">Editar empreendimento</button><button class="button teal add-table" type="button">+ Adicionar nova tabela</button></div></section>${history(tables)}`;
    }
    function bindForm() {
      document.getElementById('emp-form').onsubmit = async event => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.currentTarget));
        try { const saved = await api(id ? `/api/empreendimentos/${id}` : '/api/empreendimentos',{ method:id ? 'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }); location.href = `empreendimento.html?id=${saved.id}`; }
        catch (error) { const box = document.getElementById('form-message'); box.className = 'error'; box.textContent = error.message; }
      };
    }
    function render() {
      app.innerHTML = pageHead() + (id ? details() : form());
      if (!id) return bindForm();
      document.querySelectorAll('[data-tab]').forEach(button => button.onclick = () => { document.querySelectorAll('[data-tab]').forEach(item => item.classList.remove('active')); button.classList.add('active'); document.getElementById('info').classList.toggle('hidden',button.dataset.tab !== 'info'); document.getElementById('history').classList.toggle('hidden',button.dataset.tab !== 'history'); });
      document.getElementById('edit').onclick = () => { app.innerHTML = pageHead() + form(); bindForm(); };
      document.querySelectorAll('.add-table').forEach(button => button.onclick = openNewTable);
      document.querySelectorAll('.review').forEach(button => button.onclick = () => openReview(empreendimento.tabelas.find(table => table.id === button.dataset.id)));
      document.querySelectorAll('.modalidade').forEach(button => button.onclick = () => openTableType(empreendimento.tabelas.find(table => table.id === button.dataset.id)));
      document.querySelectorAll('.reprocess').forEach(button => button.onclick = async () => { button.disabled = true; button.textContent = 'Lendo PDF…'; try { const table = await api(`/api/empreendimentos/${id}/tabelas/${button.dataset.id}/reprocessar`,{method:'POST'}); Object.assign(empreendimento.tabelas.find(item => item.id === table.id),table); render(); openReview(table); } catch(error) { alert(error.message); button.disabled=false; button.textContent='Reprocessar'; } });
    }
    function closeModal() { modal.classList.add('hidden'); modal.innerHTML = ''; }
    function openNewTable() {
      modal.classList.remove('hidden');
      modal.innerHTML = `<div class="modal-box"><h2>Adicionar tabela comercial</h2><p class="meta">O PDF será copiado, processado e organizado. A data representa a validade da tabela — não a data de envio.</p><form id="table-form" style="margin-top:16px"><div class="form-grid">${input('tableName','Nome da tabela','Tabela geral')}${select('tableType','Modalidade comercial','Padrão / não informado',['Padrão / não informado','À vista','Financiamento CEF / Caixa','Financiamento bancário','Financiamento direto com construtora','Outro'])}${input('validityDate','Data de validade','','date')}<div class="field full"><label for="pdf">PDF original</label><input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required></div>${textarea('commercialRules','Regras comerciais gerais','')}${textarea('tableNotes','Observações','')}</div><div id="table-message" class="hidden" style="margin-top:14px"></div><div class="form-footer"><button class="button ghost" type="button" id="close">Cancelar</button><button class="button teal" type="submit">Processar tabela</button></div></form></div>`;
      document.getElementById('close').onclick = closeModal;
      document.getElementById('table-form').onsubmit = async event => { event.preventDefault(); const submit = event.submitter; submit.disabled = true; submit.textContent = 'Processando…'; const formData = new FormData(event.currentTarget); formData.set('nome',formData.get('tableName')); formData.set('tipoTabela',formData.get('tableType')); formData.set('dataValidade',formData.get('validityDate')); formData.set('regrasComerciais',formData.get('commercialRules')); formData.set('observacoes',formData.get('tableNotes')); try { const table = await api(`/api/empreendimentos/${id}/tabelas`,{method:'POST',body:formData}); empreendimento.tabelas.push(table); closeModal(); render(); openReview(table); } catch (error) { const box = document.getElementById('table-message'); box.className = 'error'; box.textContent = error.message; submit.disabled = false; submit.textContent = 'Processar tabela'; } };
    }
    function openTableType(table) {
      const options=['Padrão / não informado','À vista','Financiamento CEF / Caixa','Financiamento bancário','Financiamento direto com construtora','Outro'];
      modal.classList.remove('hidden'); modal.innerHTML=`<div class="modal-box"><h2>Modalidade da tabela</h2><p class="meta">A comparação de versões ocorre somente dentro da mesma modalidade.</p><form id="type-form" style="margin-top:16px"><div class="field"><label for="table-type">Modalidade comercial</label><select id="table-type">${options.map(option=>`<option ${option===table.tipoTabelaLabel?'selected':''}>${esc(option)}</option>`).join('')}</select></div><div class="form-footer"><button class="button ghost" type="button" id="close-type">Cancelar</button><button class="button teal" type="submit">Salvar modalidade</button></div></form></div>`;
      document.getElementById('close-type').onclick=closeModal; document.getElementById('type-form').onsubmit=async event=>{event.preventDefault();try{const saved=await api(`/api/empreendimentos/${id}/tabelas/${table.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipoTabela:document.getElementById('table-type').value})});Object.assign(table,saved);closeModal();render()}catch(error){alert(error.message)}};
    }
    function openReview(table) {
      modal.classList.remove('hidden'); const comparison = table.comparacao || {}; const warnings = table.extracao?.warnings || [];
      const mapping = table.normalizacao?.campos || []; const sample = table.unidades?.[0]?.condicoes; const needsBase = Boolean(table.manualReviewRequired) && !(table.unidades || []).length; const baseNotice = table.manualReviewBaseTableId ? `<div class="notice" style="margin:14px 0"><strong>Base de revisão:</strong> unidades copiadas da versão ${esc(table.manualReviewBaseTableId)}. Atualize apenas os valores conferidos no PDF-imagem antes de confirmar. <a href="${esc(table.documento?.path || '#')}" target="_blank">Abrir PDF de referência</a></div>` : '';
      const rows = (table.unidades || []).map((unit,index) => `<tr><td><input name="quadra_${index}" value="${esc(unit.quadra)}"><input type="hidden" name="id_${index}" value="${esc(unit.id)}"><input type="hidden" name="key_${index}" value="${esc(unit.chave)}"></td><td><input name="unidade_${index}" value="${esc(unit.unidade)}"></td><td>${unit.vagas ?? '—'}</td><td>${unit.areaPrivativa ? `${String(unit.areaPrivativa).replace('.',',')} m²`:'—'}</td><td>${esc(unit.situacaoExtraida || 'Não identificado')}</td><td class="num">${money(unit.valorExtraido)}</td><td class="num">${money(unit.valorAvaliacaoExtraido)}</td><td class="num"><input name="valor_${index}" type="number" min="0" step="0.01" value="${unit.valorValidado ?? unit.valorInterpretado ?? ''}"></td></tr>`).join('');
      const action = needsBase ? `<section class="notice" style="margin-top:16px"><strong>PDF em imagem detectado.</strong> Para não inventar leitura, o sistema ainda não classificou entradas, saídas ou preços. Use as 180 unidades da versão anterior apenas como base de revisão; depois ajuste no PDF as unidades destacadas e confirme.</section><div class="form-footer"><button class="button ghost" type="button" id="close-review">Fechar</button><button class="button teal" type="button" id="use-previous">Usar versão anterior como base</button></div>` : `<form id="review-form"><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Bloco</th><th>Unidade</th><th>Vagas</th><th>Área</th><th>Situação</th><th class="num">Preço do imóvel</th><th class="num">Avaliação Caixa</th><th class="num">Preço validado</th></tr></thead><tbody>${rows}</tbody></table></div><div class="field" style="margin-top:14px"><label for="rules">Regras comerciais gerais</label><textarea id="rules">${esc(table.regrasComerciais || '')}</textarea></div><div class="form-footer"><button class="button ghost" type="button" id="close-review">Fechar</button><button class="button teal" type="submit">Confirmar e cadastrar</button></div></form>`;
      modal.innerHTML = `<div class="modal-box"><h2>Validação · ${esc(table.name)}</h2><p class="meta">${esc(table.tipoTabelaLabel || 'Padrão')} · Validade: ${brDate(table.validityDate)} · ${table.unidades?.length || 0} unidades identificadas</p>${warnings.length ? `<div class="alert" style="margin:14px 0">${warnings.map(esc).join('<br>')}</div>` : ''}${baseNotice}<div class="tags" style="margin:14px 0"><span class="tag">${comparison.novas?.length || 0} novas</span><span class="tag gray">${comparison.removidas?.length || 0} removidas</span><span class="tag warn">${comparison.alteracoesValor?.length || 0} alterações de valor</span></div>${mapping.length ? `<div class="notice" style="margin:14px 0"><strong>Campos normalizados:</strong> ${mapping.map(item => `${esc(item.origem)} → ${esc(item.campoPadrao)}`).join(' · ')}</div>` : ''}${sample ? `<div class="notice" style="margin:14px 0"><strong>Condição identificada:</strong> sinal ${money(sample.sinal?.valor)} (${sample.sinal?.percentual || '—'}%); ${sample.parcelas?.quantidade || '—'}x de ${money(sample.parcelas?.valor)}; ${sample.intercaladas?.quantidade || '—'} intercaladas de ${money(sample.intercaladas?.valor)}; chave ${money(sample.chave?.valor)}.</div>` : ''}<p class="notice">Preço do imóvel é o valor usado no VGV e nas variações. A avaliação Caixa é apenas referência.</p>${action}</div>`;
      document.getElementById('close-review').onclick = closeModal;
      if (needsBase) { document.getElementById('use-previous').onclick = async event => { const button = event.currentTarget; button.disabled = true; button.textContent = 'Carregando base…'; try { const saved = await api(`/api/empreendimentos/${id}/tabelas/${table.id}/usar-versao-anterior`,{method:'POST'}); Object.assign(table,saved); openReview(table); } catch (error) { alert(error.message); button.disabled = false; button.textContent = 'Usar versão anterior como base'; } }; return; }
      document.getElementById('review-form').onsubmit = async event => { event.preventDefault(); const formData = new FormData(event.currentTarget); const units = (table.unidades || []).map((unit,index) => ({ ...unit, id:formData.get(`id_${index}`), chave:formData.get(`key_${index}`), quadra:formData.get(`quadra_${index}`), unidade:formData.get(`unidade_${index}`), valorInterpretado:formData.get(`valor_${index}`), valorValidado:formData.get(`valor_${index}`) })); try { const saved = await api(`/api/empreendimentos/${id}/tabelas/${table.id}/validar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidades:units,regrasComerciais:document.getElementById('rules').value})}); Object.assign(table,saved); closeModal(); render(); } catch (error) { alert(error.message); } };
    }
    (async () => { if (!id) return render(); try { empreendimento = await api(`/api/empreendimentos/${id}`); render(); } catch (error) { app.innerHTML = `<div class="error">${esc(error.message)}</div>`; } })();
  </script>
</body></html>
