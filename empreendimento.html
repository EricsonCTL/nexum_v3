const STATUS=['Disponível','Vendida','Bloqueada','Reservada','Indisponível','Retirada','Não identificado'];let emp=null,selectedTables=new Set(),actionsOpen=false;
const api=(u,o)=>fetch(u,o).then(async r=>{const d=await r.json();if(!r.ok){const e=new Error(d.error||'Não foi possível concluir a operação.');Object.assign(e,d);throw e}return d});

const date=v=>{if(!v)return'—';const parsed=new Date(/^\d{4}-\d{2}-\d{2}$/.test(v)?`${v}T12:00:00`:v);return Number.isNaN(parsed.getTime())?'—':parsed.toLocaleDateString('pt-BR')};const money=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';

function close(){modal.classList.add('hidden');modal.innerHTML='';modal.onclick=null}function header(title,sub,meta=''){return `<header class="modal-header"><div><h2>${title}</h2><p>${sub}</p>${meta?`<div class="modal-meta">${meta}</div>`:''}</div><button class="modal-close" type="button" data-close>×</button></header>`}function open(content,kind='compact-shell'){modal.innerHTML=`<section class="modal-shell ${kind}">${content}</section>`;modal.classList.remove('hidden');modal.onclick=e=>{if(e.target===modal)close()};modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
function field(n,l,v='',type='text',full=false){return `<div class="field ${full?'full':''}"><label for="${n}">${l}</label><input id="${n}" name="${n}" type="${type}" value="${esc(v)}"></div>`}function choices(n,l,v,items){return `<div class="field"><label for="${n}">${l}</label><select id="${n}" name="${n}">${items.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function area(n,l,v=''){return `<div class="field full"><label for="${n}">${l}</label><textarea id="${n}" name="${n}">${esc(v)}</textarea></div>`}
function metrics(t){const c=t.comparacao||{},a=t.alertas||[];return{u:(t.unidades||[]).length,n:(c.novas||[]).length,m:(c.removidas||[]).length,p:(c.alteracoesValor||[]).length,x:a.filter(x=>x.nivel==='critico').length}}
function selectedRows(rows){return rows.filter(t=>selectedTables.has(t.id))}function selectionLabel(n){return `${n} selecionada${n===1?'':'s'}`}function history(){const rows=[...(emp.tabelas||[])].sort((a,b)=>b.validityDate.localeCompare(a.validityDate)),selected=selectedRows(rows),count=selected.length,one=count===1,two=count===2;return rows.length?`<div class="version-context"><span class="selection-count">${selectionLabel(count)}</span><span class="selection-help">Selecione versões para revisar, comparar ou arquivar.</span><div class="version-context-actions"><button class="button ghost compare-selected" ${two?'':'disabled'}>⇄ Comparar versões</button><div class="table-actions-control"><button class="button teal table-actions-trigger" ${count?'':'disabled'} aria-expanded="${actionsOpen?'true':'false'}">Ações <span>⌄</span></button>${actionsOpen?`<div class="table-actions-menu" role="menu"><button class="action-review" data-table-action="review" ${one?'':'disabled'}><b>↗ Revisar</b><span>Visualizar e revisar esta versão</span></button><button class="action-compare" data-table-action="compare" ${two?'':'disabled'}><b>⇄ Comparar</b><span>Compare duas versões selecionadas</span></button><button class="action-standard" data-table-action="standard" ${one?'':'disabled'}><b>★ Definir padrão</b><span>Usar como referência nas análises</span></button><i></i><button class="action-delete" data-table-action="delete" ${one?'':'disabled'}><b>⌫ Excluir</b><span>Arquivar esta versão</span></button></div>`:''}</div></div></div><div class="table-wrap"><table><thead><tr><th class="selection-column"><span class="sr-only">Selecionar</span></th><th>Versão</th><th>Modalidade</th><th>Status</th><th>Atualizado em</th></tr></thead><tbody>${rows.map(t=>{const m=metrics(t),isStandard=emp.tabelaPadraoTableId===t.id,details=`Origem: ${origin(t)}\n${m.u} unidades\n${m.n} novas · ${m.m} ausentes · ${m.p} preços · ${m.x} críticos`;return `<tr class="${selectedTables.has(t.id)?'is-selected':''}"><td class="selection-column"><label class="table-select"><input type="checkbox" class="table-checkbox" data-id="${t.id}" ${selectedTables.has(t.id)?'checked':''}><span></span></label></td><td><strong>${esc(t.name)}</strong>${isStandard?'<span class="standard-badge">★ Padrão</span>':''}<button type="button" class="version-tooltip" tabindex="0" data-tooltip="${esc(details)}" aria-label="Ver detalhes da ${esc(t.name)}">i</button><br><span class="meta">${date(t.validityDate)} · ${esc(t.id)} · ${m.u} unidades</span></td><td>${esc(t.tipoTabelaLabel)}</td><td><span class="tag ${t.status==='registered'?'':'warn'}">${t.status==='registered'?'Confirmada':'Em revisão'}</span></td><td><span class="meta">${date(t.updatedAt||t.validityDate)}<br>${t.updatedAt?new Date(t.updatedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—'}</span></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><h3>Nenhuma versão comercial</h3><p>Importe um PDF ou crie uma cópia editável para começar.</p></div>`}
function cover(e,kind='detail'){const path=e?.imagem?.path;return path?`<figure class="enterprise-cover enterprise-cover-${kind}"><img src="/${esc(path)}" alt="Imagem de ${esc(e.nome)}"></figure>`:`<div class="enterprise-cover enterprise-cover-${kind} enterprise-cover-empty"><span>Imagem do empreendimento</span><small>Adicione uma foto no cadastro</small></div>`}
function page(){const address=[emp.endereco,emp.numero,emp.bairro,emp.cidade,emp.estado,emp.cep].filter(Boolean).join(' · '),rows=[...(emp.tabelas||[])].sort((a,b)=>b.validityDate.localeCompare(a.validityDate)),standard=rows.find(t=>t.id===emp.tabelaPadraoTableId)||rows.find(t=>/tabela geral/i.test(t.name))||rows[0],latest=rows[0],totalUnits=(standard?.unidades||latest?.unidades||[]).length;const details=`<section class="enterprise-inline-panel"><div class="enterprise-inline-info"><div><span>Localização</span><strong>${esc(address||'Não informada')}</strong></div><div><span>Tipo / padrão</span><strong>${esc(`${emp.tipo||'Outro'} · ${emp.padrao||'Outro'}`)}</strong></div><div><span>Formas de pagamento</span><strong>${esc(emp.formasPagamento||'Não informado')}</strong></div></div><div class="enterprise-inline-actions"><a class="button ghost" href="analise.html?id=${encodeURIComponent(emp.id)}">Unidades <b>›</b></a><a class="button ghost" href="simulador.html?id=${encodeURIComponent(emp.id)}">Simulação <b>›</b></a><button class="button teal" id="edit">Editar <b>›</b></button></div></section>`;const indicators=`<section class="enterprise-kpi-bar"><div><span>Total de versões</span><strong>${rows.length}</strong><small>registradas</small></div><div><span>Tabela padrão</span><strong>${esc(standard?.name||'—')}</strong><small>referência atual</small></div><div><span>Última versão</span><strong>${date(latest?.validityDate)}</strong><small>${esc(latest?.name||'sem tabela')}</small></div><div><span>Total de unidades</span><strong>${totalUnits}</strong><small>na tabela padrão</small></div><div><span>Origem dos dados</span><strong>${esc(origin(standard||{}))}</strong><small>versão de referência</small></div></section>`;return `<section class="page-head enterprise-page-heading"><div><div class="eyebrow">Cadastro estrutural · ${esc(emp.id)}</div><h1>${esc(emp.nome)}</h1><p>${esc(address||'Localização não informada')}</p>${details}</div><div class="page-actions"><a class="button ghost" href="empreendimentos.html">← Voltar</a><button class="button teal" id="new-table">+ Nova tabela</button></div></section><section class="card section enterprise-history enterprise-history-full"><div class="history-title-row"><div><div class="eyebrow">Histórico comercial</div><h2>Versões de tabela</h2><p>Origem, alertas e versões permanecem rastreáveis. Excluir remove apenas a versão ativa e arquiva o PDF.</p></div><button class="button ghost compare-selected" ${selectedTables.size===2?'':'disabled'}>⇄ Comparar versões</button></div>${history()}</section>${indicators}`}
function form(edit=emp){const v=k=>edit?.[k]||'';const currentImage=edit?.imagem?.path?`<img class="enterprise-image-preview" src="/${esc(edit.imagem.path)}" alt="Imagem atual de ${esc(edit.nome)}">`:'';return `<section class="page-head"><div><div class="eyebrow">Cadastro estrutural</div><h1>${edit?esc(edit.nome):'Novo empreendimento'}</h1><p>${edit?'Atualize a estrutura sem afetar tabelas.':'Cadastre a origem antes de iniciar o versionamento.'}</p></div><a class="button ghost" href="empreendimentos.html">← Voltar</a></section><form class="form-card" id="enterprise-form"><section class="form-section"><h2>Identificação</h2><div class="form-grid">${field('nome','Nome do empreendimento',v('nome'),'text',true)}${field('construtora','Construtora / incorporadora',v('construtora'))}${choices('tipo','Tipo',v('tipo')||'Apartamento',['Apartamento','Casa','Lote / Terreno','Comercial','Outro'])}${choices('padrao','Padrão',v('padrao')||'Outro',['Popular','Médio','Alto padrão','Luxo','Outro'])}<div class="field full enterprise-image-field"><label for="imagem">Imagem do empreendimento</label><div class="enterprise-image-input">${currentImage}<div><input id="imagem" name="imagem" type="file" accept="image/jpeg,image/png,image/webp"><div class="field-help">JPG, PNG ou WEBP até 8 MB. A imagem será usada na listagem, no cadastro e no Radar.</div></div></div></div></div></section><section class="form-section"><h2>Localização</h2><div class="form-grid">${field('endereco','Logradouro',v('endereco'),'text',true)}${field('numero','Número',v('numero'))}${field('bairro','Bairro',v('bairro'))}${field('cidade','Cidade',v('cidade'))}${field('estado','UF',v('estado'))}${field('cep','CEP',v('cep'))}</div></section><section class="form-section"><h2>Leitura comercial</h2><div class="form-grid">${area('formasPagamento','Formas de pagamento',v('formasPagamento'))}${area('caracteristicasComerciais','Características comerciais',v('caracteristicasComerciais'))}${area('observacoes','Observações',v('obser function bindForm(){document.getElementById('enterprise-form').onsubmit=async e=>{e.preventDefault();const formData=new FormData(e.currentTarget),image=formData.get('imagem');formData.delete('imagem');const payload=Object.fromEntries(formData.entries());try{const saved=await api(id?`/api/empreendimentos/${id}`:'/api/empreendimentos',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(image instanceof File&&image.size){const upload=new FormData();upload.append('imagem',image);await api(`/api/empreendimentos/${saved.id}/imagem`,{method:'POST',body:upload})}location.href=`empreendimento.html?id=${saved.id}`}catch(error){document.getElementById('form-message').innerHTML=`<div class="notice error">${esc(error.message)}</div>`}}}
function compareSelection(){const picked=selectedRows(emp.tabelas||[]).sort((a,b)=>b.validityDate.localeCompare(a.validityDate));if(picked.length!==2)return;location.href=`analise.html?id=${encodeURIComponent(emp.id)}&tabela=${encodeURIComponent(picked[0].id)}&compararCom=${encodeURIComponent(picked[1].id)}`}async function setStandard(t){try{await api(`/api/empreendimentos/${id}/tabelas/${t.id}/definir-padrao`,{method:'POST'});emp.tabelaPadraoTipo=t.tipoTabela;emp.tabelaPadraoTableId=t.id;selectedTables.clear();actionsOpen=false;render()}catch(error){window.alert(error.message)}}function bind(){document.getElementById('new-table').onclick=newTable;document.getElementById('edit').onclick=()=>{app.innerHTML=form(emp);bindForm()};document.querySelectorAll('.table-checkbox').forEach(box=>box.onchange=e=>{e.target.checked?selectedTables.add(e.target.dataset.id):selectedTables.delete(e.target.dataset.id);actionsOpen=false;render()});document.querySelectorAll('.compare-selected').forEach(button=>button.onclick=compareSelection);const trigger=document.querySelector('.table-actions-trigger');if(trigger)trigger.onclick=()=>{actionsOpen=!actionsOpen;render()};document.querySelectorAll('[data-table-action]').forEach(button=>button.onclick=()=>{const selected=selectedRows(emp.tabelas||[]);if(button.dataset.tableAction==='review'&&selected.length===1)review(selected[0]);if(button.dataset.tableAction==='compare'&&selected.length===2)compareSelection();if(button.dataset.tableAction==='standard'&&selected.length===1)setStandard(selected[0]);if(button.dataset.tableAction==='delete'&&selected.length===1)remove(selected[0])})}function render(){app.innerHTML=isNew?form():page();isNew?bindForm():bind()}
function newTable(){open(`${header('Como deseja criar a nova tabela?','Toda versão passa por interpretação, comparação e revisão antes de ser confirmada.')}<div class="modal-body"><div class="new-table-choice"><button class="choice-card" id="import" type="button"><span class="choice-icon">↥</span><strong>Importar arquivo</strong><span>Receba um PDF, interprete, compare e revise antes de versionar.</span></button><button class="choice-card" id="copy" type="button"><span class="choice-icon">⧉</span><strong>Criar a partir de tabela existente</strong><span>Crie uma cópia editável para atualização manual, sem PDF.</span></button></div></div>`);document.getElementById('import').onclick=importTable;document.getElementById('copy').onclick=copyTable}
function importTable(){open(`${header('Importar tabela comercial','O arquivo será interpretado e comparado. Nenhuma importação é confirmada automaticamente.')}<form class="modal-body" id="import-form"><div class="form-grid">${field('nome','Nome da tabela','Tabela comercial')}${choices('tipoTabela','Modalidade','Padrão / não informado',['Padrão / não informado','À vista','Financiamento CEF / Caixa','Financiamento bancário','Financiamento direto com construtora','Outro'])}${field('dataValidade','Data de validade','','date')}<div class="field full"><label for="pdf">PDF original</label><input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required><div class="field-help">PDF textual ou imagem; a confiança da leitura será registrada.</div></div>${area('regrasComerciais','Regras comerciais gerais')}${area('observacoes','Observações')}</div><div id="import-msg"></div></form><footer class="modal-footer"><span class="meta">Arquivo recebido → interpretar → comparar → revisar</span><div class="footer-actions"><button class="button ghost" type="button" data-close>Cancelar</button><button class="button teal" type="submit" form="import-form">Interpretar e revisar</button></div></footer>`);document.getElementById('import-form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='Interpretando…';try{const t=await api(`/api/empreendimentos/${id}/tabelas`,{method:'POST',body:new FormData(e.currentTarget)});emp.tabelas.push(t);close();render();review(t)}catch(error){document.getElementById('import-msg').innerHTML=`<div class="notice error">${esc(error.message)}</div>`;btn.disabled=false;btn.textContent='Interpretar e revisar'}}}
function copyTable(){const tables=[...(emp.tabelas||[])].sort((a,b)=>b.validityDate.localeCompare(a.validityDate));if(!tables.length)return importTable();let base=tables[0].id;const list=()=>tables.map(t=>`<button type="button" class="base-table-option ${t.id===base?'is-selected':''}" data-base="${t.id}"><div><strong>${esc(t.name)} · ${date(t.validityDate)}</strong><span>${esc(t.id)} · ${esc(t.tipoTabelaLabel)} · ${(t.unidades||[]).length} unidades</span><em class="table-origin">${esc(origin(t))}</em></div><span class="tag ${t.status==='registered'?'':'warn'}">${t.status==='registered'?'Confirmada':'Em revisão'}</span></button>`).join('');open(`${header('Criar cópia editável','A tabela-base permanece intacta. Use para alterações manuais por telefone, WhatsApp ou outro meio.')}<form class="modal-body" id="copy-form"><div class="form-grid">${field('copy-name','Nome da nova versão',`Cópia de ${tables[0].name}`)}${field('copy-date','Data de validade','','date')}${area('copy-notes','Origem / observações','Atualização manual')}</div><div class="section-head"><div><h2>Selecione a tabela-base</h2><p>Unidades, preços, condições e campos estruturados serão copiados para revisão.</p></div></div><div class="base-table-list" id="bases">${list()}</div><div id="copy-msg"></div></form><footer class="modal-footer"><span class="meta">A nova versão ficará em revisão.</span><div class="footer-actions"><button class="button ghost" type="button" data-close>Cancelar</button><button class="button teal" form="copy-form" type="submit">Criar cópia editável</button></div></footer>`);document.getElementById('bases').onclick=e=>{const b=e.target.closest('[data-base]');if(!b)return;base=b.dataset.base;document.getElementById('bases').innerHTML=list()};document.getElementById('copy-form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const t=await api(`/api/empreendimentos/${id}/tabelas/copiar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tabelaBaseId:base,nome:document.getElementById('copy-name').value,dataValidade:document.getElementById('copy-date').value,observacoes:document.getElementById('copy-notes').value})});emp.tabelas.push(t);close();render();review(t)}catch(error){document.getElementById('copy-msg').innerHTML=`<div class="notice error">${esc(error.message)}</div>`;btn.disabled=false}}}
function remove(t){const m=metrics(t);open(`${header('Excluir tabela?','A exclusão é controlada. A versão sai da lista ativa, o empreendimento é preservado e o PDF é arquivado.')}<div class="modal-body"><section class="notice warning"><strong>Você está prestes a excluir:</strong><br>${esc(t.name)}<br>${esc(t.tipoTabelaLabel)} · ${date(t.validityDate)} · ${m.u} unidades</section><p class="meta">Se esta versão for referência de outra, o sistema impedirá a exclusão e mostrará as dependências.</p><div id="delete-msg"></div></div><footer class="modal-footer"><span class="meta">Esta ação não remove o empreendimento.</span><div class="footer-actions"><button class="button ghost" type="button" data-close>Cancelar</button><button class="button danger-button" id="delete-confirm">Excluir tabela</button></div></footer>`);document.getElementById('delete-confirm').onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await api(`/api/empreendimentos/${id}/tabelas/${t.id}`,{method:'DELETE'});emp.tabelas=emp.tabelas.filter(x=>x.id!==t.id);close();render()}catch(error){const d=error.dependencies?.length?`<br><br><strong>Dependências:</strong><br>${error.dependencies.map(x=>`${esc(x.name)} · ${date(x.validityDate)} (${esc(x.relation)})`).join('<br>')}`:'';document.getElementById('delete-msg').innerHTML=`<div class="notice error">${esc(error.message)}${d}</div>`;b.disabled=false}}}
function flags(t,u){const c=t.comparacao||{},change=(c.alteracoesValor||[]).find(x=>x.chave===u.chave),alert=(t.alertas||[]).find(x=>x.chave===u.chave),r=[];if((c.novas||[]).includes(u.chave))r.push({k:'new',l:'Nova'});if(change)r.push({k:'price',l:change.direcao==='reducao'?'Preço ↓':'Preço ↑',critical:change.direcao==='reducao'});if(alert)r.push({k:'alert',l:alert.nivel==='critico'?'Alerta crítico':'Atenção',critical:alert.nivel==='critico',attention:alert.nivel==='atencao'});return r}
function blank(){return{id:'',quadra:'Bloco',unidade:'',descricaoExtraida:'',areaPrivativa:'',vagas:'',situacaoExtraida:'Disponível',valorInterpretado:'',valorAvaliacaoExtraido:'',condicoes:{sinal:{valor:''},parcelas:{valor:''},intercaladas:{valor:''},chave:{valor:''}}}}
function review(t){let units=(t.unidades||[]).map(x=>JSON.parse(JSON.stringify(x))),filter='all',q='';const matches=u=>{const f=flags(t,u);if(q&&!`${u.quadra} ${u.unidade} ${u.descricaoExtraida||''}`.toLowerCase().includes(q.toLowerCase()))return false;if(filter==='changed')return f.length;if(filter==='new')return f.some(x=>x.k==='new');if(filter==='price')return f.some(x=>x.k==='price');if(filter==='critical')return f.some(x=>x.critical);if(filter==='attention')return f.some(x=>x.attention);return true};const input=(u,i,key,kind='number')=>`<input class="${key.includes('valor')?'money-input':''}" data-key="${key}" ${kind==='number'?'type="number" step="0.01"':''} value="${esc(u[key]??'')}">`;const cond=(u,k)=>`<input class="money-input" data-cond="${k}" type="number" step="0.01" value="${esc(u.condicoes?.[k]?.valor??'')}">`;
function draw(){const m=metrics({...t,unidades:units}),alerts=t.alertas||[],conf=t.confiancaLeitura||{},meta=`<span class="tag">${esc(t.tipoTabelaLabel)}</span><span class="tag gray">${date(t.validityDate)}</span><span class="tag gray">${esc(origin(t))}</span><span class="tag ${conf.classificacao==='baixa'?'warn':''}">Leitura: ${esc(conf.metodo||'manual')} · ${conf.percentual??0}%</span>`;const row=(u,i)=>{const fs=flags(t,u),cls=fs.some(x=>x.critical)?'row-critical':fs.some(x=>x.attention)?'row-attention':'';return `<tr class="${cls}" data-i="${i}"><td><div class="row-flags">${fs.map(x=>`<span class="row-flag ${x.critical?'critical':''} ${x.attention?'attention':''}">${x.l}</span>`).join('')}</div></td><td>${input(u,i,'quadra','text')}</td><td>${input(u,i,'unidade','text')}</td><td>${input(u,i,'descricaoExtraida','text')}</td><td>${input(u,i,'areaPrivativa')}</td><td>${input(u,i,'vagas')}</td><td><select data-key="situacaoExtraida">${STATUS.map(s=>`<option ${s===u.situacaoExtraida?'selected':''}>${s}</option>`).join('')}</select></td><td>${cond(u,'sinal')}</td><td>${cond(u,'parcelas')}</td><td>${cond(u,'intercaladas')}</td><td>${cond(u,'chave')}</td><td>${input(u,i,'valorInterpretado')}</td><td>${input(u,i,'valorAvaliacaoExtraido')}</td></tr>`};open(`${header('Revisão da tabela',`${esc(emp.nome)} · ${esc(t.name)} · ${esc(t.id)}`,meta)}<div class="modal-body"><div class="review-summary"><button data-filter="all"><strong>${units.length}</strong><span>unidades</span></button><button data-filter="new"><strong>${m.n}</strong><span>novas</span></button><button data-filter="changed"><strong>${m.m}</strong><span>ausentes</span></button><button data-filter="price"><strong>${m.p}</strong><span>preços alterados</span></button><button data-filter="critical" class="critical"><strong>${m.x}</strong><span>alertas críticos</span></button><button data-filter="attention" class="attention"><strong>${alerts.filter(x=>x.nivel==='atencao').length}</strong><span>atenção</span></button></div><div class="review-alerts">${alerts.map(a=>`<article class="review-alert ${a.nivel==='critico'?'critical':''}"><div><strong>${esc(a.mensagem)}</strong>${a.anterior!=null?`<small>Anterior: ${money(a.anterior)} · Atual: ${money(a.atual)} · Variação: ${(a.variacao*100).toLocaleString('pt-BR',{maximumFractionDigits:2})}%</small>`:''}</div><span class="tag ${a.nivel==='critico'?'warn':''}">${a.nivel}</span></article>`).join('')}</div><div class="review-toolbar"><label>Trabalhar por exceção</label><input id="search-review" type="search" placeholder="Buscar bloco, unidade ou tipologia" value="${esc(q)}"><button class="button ghost" type="button" id="add-unit">+ Unidade</button></div><div class="review-table-wrap"><table class="review-table"><thead><tr><th>Alertas</th><th>Bloco</th><th>Unidade</th><th>Tipologia</th><th>Área m²</th><th>Vagas</th><th>Situação</th><th>Sinal</th><th>Parcelas</th><th>Intercaladas</th><th>Chave</th><th>Preço</th><th>Avaliação</th></tr></thead><tbody>${units.map((u,i)=>matches(u)?row(u,i):'').join('')||'<tr><td colspan="13" class="text-center muted">Nenhuma unidade nesta seleção.</td></tr>'}</tbody></table></div><div class="field" style="margin-top:14px"><label for="rules">Regras comerciais gerais</label><textarea id="rules">${esc(t.regrasComerciais||'')}</textarea></div></div><footer class="modal-footer"><span class="meta">Alertas críticos exigem confirmação antes da publicação.</span><div class="footer-actions"><button class="button ghost" type="button" data-close>Cancelar</button><button class="button ghost" id="draft">Salvar rascunho</button><button class="button teal" id="finish">Concluir revisão</button></div></footer>`,'review-shell');modal.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;draw()});document.getElementById('search-review').oninput=e=>{q=e.target.value;draw()};document.getElementById('add-unit').onclick=()=>{units.push(blank());filter='all';draw()};modal.querySelectorAll('tr[data-i] input,tr[data-i] select').forEach(c=>c.oninput=()=>{const u=units[Number(c.closest('tr').dataset.i)];if(c.dataset.key)u[c.dataset.key]=c.value;if(c.dataset.cond){u.condicoes=u.condicoes||{};u.condicoes[c.dataset.cond]={...(u.condicoes[c.dataset.cond]||{}),valor:c.value}}});document.getElementById('draft').onclick=()=>save('rascunho');document.getElementById('finish').onclick=()=>save('validar')}
async function save(action,confirm=false){const b=document.getElementById(action==='rascunho'?'draft':'finish');b.disabled=true;b.textContent=action==='rascunho'?'Salvando…':'Concluindo…';try{const saved=await api(`/api/empreendimentos/${id}/tabelas/${t.id}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unidades:units,regrasComerciais:document.getElementById('rules').value,confirmarAlertasCriticos:confirm})});Object.assign(t,saved);close();render()}catch(error){if(action==='validar'&&error.criticalAlerts?.length&&!confirm&&window.confirm(`${error.criticalAlerts.length} alerta(s) crítico(s) permanecem. Confirma os valores e conclui?`))return save(action,true);b.disabled=false;b.textContent=action==='rascunho'?'Salvar rascunho':'Concluir revisão';window.alert(error.message)}}draw()}
function seedDefault(){if(!emp||emp.tabelaPadraoTableId)return;const rows=[...(emp.tabelas||[])].sort((a,b)=>b.validityDate.localeCompare(a.validityDate));emp.tabelaPadraoTableId=(rows.find(t=>/tabela geral/i.test(t.name))||rows[0])?.id||null}
(async()=>{if(isNew)return render();try{emp=await api(`/api/empreendimentos/${id}`);seedDefault();render()}catch(error){app.innerHTML=`<div class="notice error">${esc(error.message)}</div>`}})();
</script></body></html>
