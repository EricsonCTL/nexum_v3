<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXUM Radar Imobiliário · Acesso</title>
  <link rel="stylesheet" href="nexo.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <img class="login-logo" src="logo/ChatGPT%20Image%2013%20de%20ago.%20de%202026,%2011_38_17.png" alt="NEXUM Radar Imobiliário">
      <p class="login-location">Campina Grande · PB</p>
      <h1 id="login-title">Inteligência<br>imobiliária</h1>
      <p class="login-copy">Escolha um perfil para importar, revisar e versionar tabelas comerciais com rastreabilidade.</p>
      <div class="profile-list" role="group" aria-label="Selecionar perfil de acesso">
        <button class="profile-option is-selected" type="button" data-user-code="ADMIN" aria-pressed="true">
          <span>Administrador</span><strong>Gestão NEXUM</strong>
        </button>
        <button class="profile-option" type="button" data-user-code="INCORPORADORA" aria-pressed="false">
          <span>Incorporadora</span><strong>Operação comercial</strong>
        </button>
      </div>
      <button class="login-submit" type="button" id="login-submit">Entrar</button>
    </section>
  </main>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
