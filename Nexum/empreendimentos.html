<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM Radar Imobiliário · Início</title><link rel="stylesheet" href="nexo.css"></head>
<body class="home-page">
<header class="topbar"><div class="topbar-inner"><a class="brand" href="inicio.html"><img src="logo/logo_branca.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav"><a href="inicio.html">Início</a><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa</a><a href="analytics.html">Analytics</a><a href="rede-mercados.html">Rede</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header>
<main class="shell portfolio-shell"><section class="home-executive-layout"><section class="home-left-column"><section class="home-enterprises"><div id="portfolio-list" class="portfolio-list"><div class="loading">Carregando empreendimentos…</div></div><nav id="portfolio-pagination" class="portfolio-pagination" aria-label="Paginação de empreendimentos"></nav></section></section><aside id="portfolio-analytics" class="portfolio-analytics" aria-label="Resumo executivo"><div class="loading">Preparando resumo executivo…</div></aside></section></main>
<script src="auth.js"></script>
<script>
const user=requireCTIUser(['ADMIN','BROKER']);
const api=(url,opt)=>fetch(url,opt).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível concluir a operação.');return data});
let portfolio=null,page=1,sortBy='recent';const pageSize=6;const initialEnterpriseScope=new URLSearchParams(location.search).get('empreendimentos')||new URLSearchParams(location.search).get('empreendimento')||'';let selectedEnterpriseIds=new Set(initialEnterpriseScope.split(',').map(value=>value.trim()).filter(Boolean)),globalFilters={search:'',bairro:'',tipo:'',padrao:'',ticket:'',fase:'',dormitorios:'',caracteristicas:'',vagas:'',favorite:false,...(window.nexumGlobalFilters||{})};
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const num=value=>Number(value||0).toLocaleString('pt-BR');const date=value=>value?new Date(`${value}T12:00:00`).toLocaleDateString('pt-BR'):'—';const finite=value=>value!==null&&value!==''&&value!==undefined&&Number.isFinite(Number(value));const percent=value=>finite(value)?`${Number(value).toLocaleString('pt-BR',{maximumFractionDigits:1})}%`:'—';const ivv=value=>finite(value)?`${Number(value).toLocaleString('pt-BR',{maximumFractionDigits:1})} un./mês`:'—';
const cover=entry=>entry.imagem?.path?`<figure class="enterprise-cover enterprise-cover-card"><img src="/${esc(entry.imagem.path)}" alt="Imagem de ${esc(entry.nome)}"></figure>`:`<div class="enterprise-cover enterprise-cover-card enterprise-cover-empty"><span>Imagem do empreendimento</span></div>`;
const delivery=entry=>entry.fase==='Entregue'?'<strong class="enterprise-delivery delivered">Entregue</strong>':entry.deliveryDate?`<span class="enterprise-delivery">Entrega prevista: ${date(entry.deliveryDate)}</span>`:'';
function card(entry){const active=Boolean(entry.favorite),id=encodeURIComponent(entry.id);return `<article class="card emp-card home-enterprise-card"><a class="home-enterprise-link" href="analytics.html?id=${id}">${cover(entry)}<div class="emp-card-body"><div class="tags"><span class="tag">${esc(entry.tipo)}</span><span class="tag gray">${esc(entry.padrao)}</span>${entry.fase==='Lançamento'?'<span class="tag launch">Lançamento</span>':''}</div><h2>${esc(entry.nome)}</h2><p class="meta">⌖ ${esc([entry.bairro,entry.cidade,entry.estado].filter(Boolean).join(' · ')||'Localização não informada')}</p>${delivery(entry)}<p class="home-table-meta">Lançamento: <b>${date(entry.launchDate)}</b> · ${entry.tableCount} tabela${entry.tableCount===1?'':'s'} · última versão: ${date(entry.latestTable?.validityDate)}</p><div class="home-card-kpis"><span>IVV mensal: <b>${ivv(entry.ivv?.monthly)}</b> <i aria-hidden="true">|</i> VSO: <b>${percent(entry.vso)}</b></span></div></div></a><nav class="home-card-actions" aria-label="Ações de ${esc(entry.nome)}"><a href="mapa.html?id=${id}">Radar</a><a href="analise.html?id=${id}">Tabela</a><a href="analytics.html?id=${id}">Analytics</a></nav><button type="button" class="home-card-favorite ${active?'active':''}" data-favorite-id="${esc(entry.id)}" aria-pressed="${active}" aria-label="${active?'Remover dos favoritos':'Favoritar empreendimento'}" title="${active?'Remover dos favoritos':'Favoritar empreendimento'}">${active?'♥':'♡'}</button></article>`}
async function toggleFavorite(enterpriseId){const entry=(portfolio?.entries||[]).find(item=>item.id===enterpriseId);if(!entry)return;const previous=Boolean(entry.favorite);entry.favorite=!previous;renderList();try{const result=await api(`/api/user-favorites/${encodeURIComponent(enterpriseId)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({favorite:!previous})});entry.favorite=Boolean(result.favorite);renderList()}catch(error){entry.favorite=previous;renderList();window.alert(error.message)}}
function renderList(){const rows=[...(portfolio?.entries||[])],alpha=entries=>entries.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')),favorites=alpha(rows.filter(entry=>entry.favorite)),favoriteIds=new Set(favorites.map(entry=>entry.id)),launches=rows.filter(entry=>!favoriteIds.has(entry.id)&&entry.fase==='Lançamento').sort((a,b)=>String(b.firstTableDate||'').localeCompare(String(a.firstTableDate||''))||a.nome.localeCompare(b.nome,'pt-BR')),launchIds=new Set(launches.map(entry=>entry.id)),others=alpha(rows.filter(entry=>!favoriteIds.has(entry.id)&&!launchIds.has(entry.id))),ordered=[...favorites,...launches,...others],pages=Math.max(1,Math.ceil(ordered.length/pageSize));page=Math.min(page,pages);const chunk=ordered.slice((page-1)*pageSize,page*pageSize);document.getElementById('portfolio-list').innerHTML=rows.length?`<div class="portfolio-grid">${chunk.map(card).join('')}</div>`:'<div class="empty"><h3>Nenhum empreendimento encontrado</h3><p>Revise os filtros aplicados ao portfólio.</p></div>';document.querySelectorAll('[data-favorite-id]').forEach(button=>button.addEventListener('click',()=>toggleFavorite(button.dataset.favoriteId)));document.getElementById('portfolio-pagination').innerHTML=pages>1?`<button type="button" data-page="${page-1}" ${page===1?'disabled':''}>← Anterior</button><span>${(page-1)*pageSize+1}–${Math.min(page*pageSize,ordered.length)} de ${ordered.length} empreendimentos</span><button type="button" data-page="${page+1}" ${page===pages?'disabled':''}>Próxima →</button>`:'';document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{page=Number(button.dataset.page);renderList()})}
function chip(label,key){return `<button type="button" class="home-filter-chip" data-filter-key="${esc(key)}">${esc(label)} <span aria-hidden="true">×</span></button>`}
function renderAnalytics(){const host=document.getElementById('portfolio-analytics'),kpis=portfolio?.kpis||{},podium=portfolio?.podium||[],noSales=portfolio?.noSales||[],changes=portfolio?.changes||[],pulse=portfolio?.pulse?.paragraphs||[],ticketLabels={'ate-500':'Até R$ 500 mil','500-800':'R$ 500 mil – R$ 800 mil','800-1200':'R$ 800 mil a R$ 1,2 mi','acima-1200':'Acima de R$ 1,2 mi'},filterLabels={bairro:'Bairro',padrao:'Padrão Econômico',dormitorios:'Dormitórios',caracteristicas:'Características',vagas:'Vagas',favorite:'Somente favoritos'},domains=window.nexumDomains||{},domainLabel=(key,value)=>key==='bairro'?(domains.neighborhoods||[]).find(item=>item.id===value)?.nome||value:key==='padrao'?(domains.economicStandards||[]).find(item=>item.id===value)?.nome||value:value,icons={price:'↗',condition:'◉',stock:'▧',return:'↶',sale:'✓'},kpiRows=[['▦','Empreendimentos',num(kpis.empreendimentos),''],['▣','Unidades disponíveis',num(kpis.disponiveis),''],['◌','VSO do portfólio',percent(kpis.vso),'highlight'],['⌁','IVV mensal',ivv(kpis.ivv),''],['⌑','Vendas validadas',num(kpis.vendasValidadas),''],['▤','Tabelas recentes',num(kpis.tabelasRecentes),'']];const globalChips=Object.entries(globalFilters).filter(([key,value])=>value&&!(key==='period'&&value==='12m')).map(([key,value])=>chip(key==='ticket'?ticketLabels[value]:key==='search'?`Busca: ${value}`:filterLabels[key]?`${filterLabels[key]}: ${domainLabel(key,value)}`:value,key));const selectionChips=(portfolio?.entries||[]).filter(entry=>selectedEnterpriseIds.has(entry.id)).map(entry=>`<button type="button" class="home-filter-chip" data-clear-enterprise="${esc(entry.id)}">Empreendimento: ${esc(entry.nome)} <span aria-hidden="true">×</span></button>`);const chips=[...globalChips,...selectionChips].join('');host.innerHTML=`<section class="executive-section executive-summary"><div class="executive-title"><i>▥</i><div><h2>Resumo Executivo</h2><span>Análise do Portfólio</span></div></div><div class="executive-kpis">${kpiRows.map(([icon,label,value,kind])=>`<article class="${kind}"><i>${icon}</i><div><span>${label}</span><strong>${value}</strong></div></article>`).join('')}</div></section><section class="executive-section"><div class="executive-title"><i>♜</i><div><h2>Pódio de VSO</h2><span>Top 3 empreendimentos por VSO do portfólio</span></div></div>${podium.length?`<ol class="vso-podium">${podium.map((entry,index)=>`<li class="place-${index+1}"><i>${['①','②','③'][index]}</i><div><strong>${esc(entry.nome)}</strong></div><b>${percent(entry.vso)}<small>VSO</small></b><em>${ivv(entry.ivv?.monthly)}<small>IVV</small></em></li>`).join('')}</ol>`:'<p class="executive-empty">Ainda não há base comparável para o ranking de VSO.</p>'}</section><section class="executive-section pulse"><div class="executive-title"><i>〽</i><div><h2>Pulso do Portfólio</h2><span>Leitura NEXUM</span></div></div>${pulse.map(text=>`<p>${esc(text)}</p>`).join('')}</section>${noSales.length?`<section class="executive-section attention"><div class="executive-title"><i>⚠</i><div><h2>Empreendimentos sem vendas</h2><span>Critério: última tabela em até 30 dias e ausência de vendas identificadas nos últimos 90 dias.</span></div></div><div class="attention-list">${noSales.map((entry,index)=>`<article><i>${index+1}</i><strong>${esc(entry.nome)}</strong><span>Últ. tabela há ${entry.latestAge} dias</span></article>`).join('')}</div></section>`:''}${changes.length?`<section class="executive-section recent-changes"><div class="executive-title"><i>▤</i><div><h2>Mudanças recentes</h2><span>Alterações de tabela identificadas</span></div></div><div>${changes.map(change=>`<a href="analytics.html?id=${encodeURIComponent(change.enterpriseId)}"><i>${icons[change.kind]||'•'}</i><strong>${esc(change.enterprise)}</strong><span>${esc(change.text)}</span><b>›</b></a>`).join('')}</div></section>`:''}${chips?`<section class="executive-section applied"><div class="executive-title"><i>⌘</i><div><h2>Filtros aplicados</h2><span>Contexto do portfólio</span></div></div><div class="home-filter-chips">${chips}</div><button type="button" class="clear-home-filters" id="clear-home-filters">Limpar filtros</button></section>`:''}`;host.querySelectorAll('[data-filter-key]').forEach(button=>button.onclick=()=>{globalFilters[button.dataset.filterKey]=button.dataset.filterKey==='favorite'?false:'';window.nexumSetGlobalFilters?.(globalFilters);page=1;load()});host.querySelectorAll('[data-clear-enterprise]').forEach(button=>button.onclick=()=>{selectedEnterpriseIds.delete(button.dataset.clearEnterprise);page=1;load()});host.querySelector('#clear-home-filters')?.addEventListener('click',()=>{selectedEnterpriseIds.clear();globalFilters={search:'',bairro:'',tipo:'',padrao:'',ticket:'',fase:'',dormitorios:'',caracteristicas:'',vagas:'',favorite:false};window.nexumSetGlobalFilters?.(globalFilters);page=1;load()})}
const renderAnalyticsBase=renderAnalytics;renderAnalytics=function(){renderAnalyticsBase();const criterion=document.querySelector('.attention .executive-title span');if(criterion)criterion.textContent='Empreendimentos cuja tabela mais recente foi cadastrada nos últimos 30 dias e que não registraram vendas nos 90 dias anteriores a essa tabela.'}
async function load(){try{const query=new URLSearchParams(Object.entries(globalFilters).filter(([,value])=>value));if(selectedEnterpriseIds.size)query.set('empreendimentos',[...selectedEnterpriseIds].join(','));portfolio=await api(`/api/portfolio-home?${query}`);renderList();renderAnalytics();const entries=portfolio.entries||[],kpis=portfolio.kpis||{},average=values=>{const validValues=values.map(Number).filter(Number.isFinite);return validValues.length?validValues.reduce((sum,value)=>sum+value,0)/validValues.length:null},units=entries.reduce((sum,row)=>sum+Number(row.current?.units||0),0),sales=entries.reduce((sum,row)=>sum+Number(row.comparison?.salesConfirmed??row.current?.sold??0),0),ticket=average(entries.map(row=>row.current?.averagePrice)),m2=average(entries.map(row=>row.current?.pricePerM2));window.updateNexumFooterMetrics?.(entries,{...kpis,unidades:units,vendasValidadas:kpis.vendasValidadas??sales,ticketMedio:ticket,precoMedioM2:m2});window.updateNexumFooterContext?.({enterprises:kpis.empreendimentos,units,available:kpis.disponiveis,sales:kpis.vendasValidadas??sales,ticket,m2,adjusted:kpis.reajusteMedioMensal,adjustedMonthly:true,ivv:kpis.ivv,vso:kpis.vso})}catch(error){document.getElementById('portfolio-list').innerHTML=`<div class="error">${esc(error.message)}</div>`;document.getElementById('portfolio-analytics').innerHTML=''}}
window.nexumGetEnterpriseSelectionScope=()=>portfolio?.entries||[];window.nexumGetEnterpriseSelection=()=>[...selectedEnterpriseIds];window.addEventListener('nexum:enterprise-selection',event=>{selectedEnterpriseIds=new Set((event.detail?.ids||[]).map(String));page=1;load()});window.addEventListener('nexum:clear-enterprise-selection',()=>{if(!selectedEnterpriseIds.size)return;selectedEnterpriseIds.clear();page=1;load()});window.addEventListener('nexum:global-filters',event=>{globalFilters={...globalFilters,...(event.detail||{})};page=1;load()});load();
</script><script>
function nexumFavoriteBookmark(active){return `<svg class="favorite-bookmark-icon ${active?'is-active':''}" viewBox="0 0 24 28" aria-hidden="true" focusable="false"><path class="favorite-bookmark-shape" d="M4.5 2.5h15a1.5 1.5 0 0 1 1.5 1.5v20.1a1.3 1.3 0 0 1-2.02 1.08L12 20.84 5.02 25.18A1.3 1.3 0 0 1 3 24.1V4a1.5 1.5 0 0 1 1.5-1.5Z"/><path class="favorite-bookmark-star" d="m12 7.2 1.45 2.94 3.25.47-2.35 2.3.56 3.24L12 14.63l-2.91 1.52.56-3.24-2.35-2.3 3.25-.47L12 7.2Z"/></svg>`}
function decorateFavoriteBookmarks(){document.querySelectorAll('.home-card-favorite').forEach(button=>{const active=button.getAttribute('aria-pressed')==='true';if(button.dataset.bookmarkState===String(active))return;button.dataset.bookmarkState=String(active);button.innerHTML=nexumFavoriteBookmark(active)})}
decorateFavoriteBookmarks();new MutationObserver(decorateFavoriteBookmarks).observe(document.body,{childList:true,subtree:true});
</script></body></html>
