    function lineChart(series,key,color='#0aa493',formatter=num) {

      const values=rows.map(row=>Number(row[key])), rawMin=Math.min(...values), rawMax=Math.max(...values), padding=(rawMax-rawMin||Math.max(Math.abs(rawMax),1))*.13, min=rawMin-padding, max=rawMax+padding, range=max-min||1, width=760,height=222,left=47,right=18,top=22,bottom=38, plotHeight=height-top-bottom, plotWidth=width-left-right, ticks=4;
      const point=(row,index)=>({x:left+(rows.length===1?plotWidth/2:index*plotWidth/(rows.length-1)),y:top+(max-Number(row[key]))*plotHeight/range,row}); const points=rows.map(point);

      return `<svg class="analytics-line-chart" viewBox="0 0 ${width} ${height}" role="img">${grid}<polyline points="${points.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${points.map((p,index)=>{const labelY=Math.max(13,p.y-(index%2?13:9));const evidence=p.row.tipoObservacao==='DERIVADO_LANCAMENTO'?' · média derivada desde o lançamento':p.row.tipoObservacao==='DERIVADO_INTERVALO'?' · média derivada do intervalo':'';return `<g><circle cx="${p.x}" cy="${p.y}" r="4.3" fill="#fff" stroke="${color}" stroke-width="2.6"><title>${month(p.row.mes)} · ${formatter(p.row[key])}${evidence}</title></circle><text x="${p.x}" y="${height-12}" text-anchor="middle" class="month">${esc(month(p.row.mes))}</text><text x="${p.x}" y="${labelY}" text-anchor="middle" class="value">${esc(formatter(p.row[key]))}</text></g>`}).join('')}</svg>`;
    }
    function overviewTwelveMonthChart(series,endMonth) {

      if(!latestMonth)return '<div class="analytics-empty-chart">Sem observações para este recorte.</div>';
      const [latestYear,latestNumber]=latestMonth.split('-').map(Number),months=Array.from({length:12},(_,index)=>{const dateValue=new Date(latestYear,latestNumber-12+index,1);return `${dateValue.getFullYear()}-${String(dateValue.getMonth()+1).padStart(2,'0')}`;}),values=available.filter(row=>months.includes(row.mes)).map(row=>row.value);
      if(!values.length)return '<div class="analytics-empty-chart">Sem observações nos últimos 12 meses disponíveis.</div>';
      const rawMin=Math.min(...values),rawMax=Math.max(...values),basePadding=(rawMax-rawMin||Math.max(Math.abs(rawMax),1))*.14,min=rawMin<0?Math.min(0,rawMin-basePadding):rawMin-basePadding,max=rawMax>0?rawMax+basePadding:Math.max(0,rawMax+basePadding),range=max-min||1,width=1120,height=294,left=66,right=30,top=34,bottom=48,plotWidth=width-left-right,plotHeight=height-top-bottom,ticks=4,x=index=>left+index*plotWidth/11,y=value=>top+(max-value)*plotHeight/range;

      return `<div class="analytics-v6-history">${series.length>1?`<div class="analytics-v6-history-legend">${series.map(item=>`<span><i style="background:${item.color}"></i>${esc(item.label)}</span>`).join('')}</div>`:''}<svg class="analytics-line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Evolução mensal nos últimos 12 meses">${grid}${min<0&&max>0?`<line x1="${left}" y1="${y(0)}" x2="${width-right}" y2="${y(0)}" class="overview-zero-line"/>`:''}${lines}${months.map((period,index)=>`<text x="${x(index)}" y="${height-14}" text-anchor="middle" class="month">${esc(month(period))}</text>`).join('')}</svg></div>`;
    }
    function multiLineChart(series,key,formatter) {
      const colors=['#00a493','#173d78','#bf7a12','#8b53a6','#d35f53'];
      const visibleSeries=series.slice(0,5);
      const all=visibleSeries.flatMap(item=>(item.rows||[]).filter(row=>valid(row[key])).map(row=>Number(row[key])));

      const min=Math.min(...all),max=Math.max(...all),range=max-min||1,width=640,height=170,left=40,right=18,top=18,bottom=32;

    function syncFooter(values) { const apply=()=>window.updateNexumFooterContext?window.updateNexumFooterContext(values):setTimeout(apply,40); apply(); }
    function queryString() { const query=new URLSearchParams(); if(state.selected.size)query.set('empreendimentos',[...state.selected].join(',')); for(const key of ['modalidade','tipologia','status','de','ate'])if(state[key])query.set(key,state[key]); for(const [key,value] of Object.entries(state.shared || {})) if(key!=='period'&&value) query.set(key,value); return query.toString(); }
    function periodBounds(period) { const end=new Date(), start=new Date(end); if(period==='current-month')start.setDate(1); else if(period==='30d')start.setDate(start.getDate()-29); else if(period==='60d')start.setDate(start.getDate()-59); else if(period==='90d')start.setDate(start.getDate()-89); else if(period==='current-year'){start.setMonth(0,1)} else start.setMonth(start.getMonth()-11,1); const key=value=>`${value.getFullYear()}-${String(value.getMonth()+1).padStart(2,'0')}`; return { de:key(start), ate:key(end) }; }

    function externalFilters() { const periodLabels={ '30d':'Últimos 30 dias','current-month':'Mês atual','60d':'Últimos 60 dias','90d':'Últimos 90 dias','12m':'Últimos 12 meses','current-year':'Ano corrente' }, ticketLabels={'ate-500':'Até R$ 500 mil','500-800':'R$ 500 a 800 mil','800-1200':'R$ 800 mil a 1,2 mi','acima-1200':'Acima de R$ 1,2 mi'}, labels={bairro:'Bairro',tipo:'Tipo',padrao:'Padrão Econômico',ticket:'Faixa',fase:'Fase',search:'Busca',dormitorios:'Dormitórios',caracteristicas:'Características',vagas:'Vagas',favorite:'Favoritos'}, filters=[]; if(state.period!=='all')filters.push({key:'period',label:`Período: ${periodLabels[state.period]||'Personalizado'}`});Object.entries(state.shared||{}).filter(([,value])=>value).forEach(([key,value])=>filters.push({key,label:`${labels[key]||key}: ${key==='ticket'?ticketLabels[value]||value:value===true?'Sim':value}`}));return filters; }
    function externalFilterTags() { return externalFilters().map(item=>item.label); }
    function drawerFilterTags() { return `<div class="drawer-filter-tags">${externalFilterTags().map(tag=>`<span>${esc(tag)}</span>`).join('')}</div>`; }

    function change(current, previous) { return valid(current)&&valid(previous)&&Number(previous)!==0 ? (Number(current)-Number(previous))/Math.abs(Number(previous)) : null; }
    function latest(rows,key) { return [...(rows||[])].filter(row=>valid(row[key])).at(-1)?.[key] ?? null; }

    function executiveReading(photos,velocity) { const ivv=latest(velocity,'ivv'), ivvBefore=prior(velocity,'ivv'), vso=latest(velocity,'vso'), vsoBefore=prior(velocity,'vso'), ticket=latest(photos,'ticketMedio'), ticketBefore=prior(photos,'ticketMedio'), adjusted=latest(photos,'reajusteMedio'), available=latest(photos,'disponiveis'), availableBefore=prior(photos,'disponiveis'); const salesText=valid(ivv)?`A velocidade comercial fechou em <strong>${num(ivv)} un./mês</strong>${change(ivv,ivvBefore)!==null?`, ${variationText(ivv,ivvBefore)} frente à observação anterior`:''}.`: 'Ainda não há base suficiente para calcular a velocidade comercial.'; const vsoText=valid(vso)?`A absorção sobre a oferta ficou em <strong>${percentValue(vso)}</strong>${change(vso,vsoBefore)!==null?`, ${variationText(vso,vsoBefore)} no mesmo comparativo`:''}.`: 'Não há VSO comparável para o período.'; const priceText=valid(ticket)?`O ticket médio disponível chegou a <strong>${money(ticket)}</strong>${change(ticket,ticketBefore)!==null?`, ${variationText(ticket,ticketBefore)} no período`:''}.`: 'Não há preço disponível comparável no período.'; const adjustmentText=valid(adjusted)?`O reajuste médio entre unidades comparáveis foi de <strong>${percent(adjusted)}</strong>.`: 'Não há pares de unidades comparáveis para medir reajuste.'; const stockText=valid(available)?`A oferta atual reúne <strong>${num(available)} unidades disponíveis</strong>${change(available,availableBefore)!==null?`, ${variationText(available,availableBefore)} versus a fotografia anterior`:''}.`: 'Não há fotografia de estoque disponível para o recorte.'; return `<section class="executive-reading"><div class="executive-reading-icon">▧</div><div><span class="eyebrow">Leitura executiva do período</span><h2>Contexto do portfólio filtrado</h2><p>${salesText} ${vsoText}</p><p>${priceText} ${adjustmentText}</p><p>${stockText} A leitura abaixo detalha velocidade, preços e estoque no mesmo recorte.</p></div></section>`; }

    function openPriceAnalysis() { const economicCategories=['Econômico','Popular / MCMV','Médio','Alto','Luxo'], propertyCategories=['Apartamento','Casa','Lote / Terreno','Sala comercial','Outros']; const normalize=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR'); const economic=value=>{const text=normalize(value);if(text.includes('econom'))return'Econômico';if(text.includes('popular')||text.includes('mcmv'))return'Popular / MCMV';if(text.includes('medio'))return'Médio';if(text.includes('alto'))return'Alto';if(text.includes('luxo'))return'Luxo';return null}; const property=value=>{const text=normalize(value);if(text.includes('apart'))return'Apartamento';if(text.includes('casa'))return'Casa';if(text.includes('lote')||text.includes('terreno'))return'Lote / Terreno';if(text.includes('sala')||text.includes('comercial'))return'Sala comercial';return'Outros'}; const aggregate=(categories,getter)=>{const groups=new Map(categories.map(category=>[category,{categoria:category,total:0,quantidade:0}]));(payload?.dispersao||[]).forEach(row=>{if(!valid(row.precoMedioM2))return;const category=getter(row);if(!category||!groups.has(category))return;const item=groups.get(category);item.total+=Number(row.precoMedioM2);item.quantidade+=1});return categories.map(category=>{const item=groups.get(category);return{...item,media:item.quantidade?item.total/item.quantidade:null}})}; const economicRows=aggregate(economicCategories,row=>economic(row.padrao)), propertyRows=aggregate(propertyCategories,row=>property(row.tipo)); const chart=(title,rows,color)=>{const max=Math.max(...rows.map(row=>Number(row.media)||0),1);return `<section class="price-analysis-card"><h3>${esc(title)}</h3><p>Preço médio por m² no recorte atual.</p><div class="price-analysis-bars">${rows.map(row=>{const width=row.media?Math.max(2,row.media/max*100):0;return `<article><div><strong>${esc(row.categoria)}</strong><span>${row.quantidade?`${row.quantidade} empreendimento(s)`:'Sem dados'}</span></div><i><b style="width:${width}%;background:${color}"></b></i><em>${row.media?money(row.media):'—'}</em></article>`}).join('')}</div></section>`}; openOverlay('Análise de Preços (m²)',`<div class="price-analysis-grid">${chart('Padrão econômico',economicRows,'#008f83')}${chart('Tipo de imóvel',propertyRows,'#1e4c8c')}</div>`); }
