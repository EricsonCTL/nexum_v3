<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM · Gestão de Construtoras</title><link rel="stylesheet" href="/nexo.css"></head>
<body class="gestao-page management-admin-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="/gestao"><img src="/logo/logo_branca.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav" data-nexum-header="ready"><a href="/gestao">Visão Geral</a><a href="/gestao/checklist">Checklist</a><a href="/gestao/tabelas">Tabelas Cadastradas</a><a href="/gestao/atualizacao-automatica">Atualização Automática</a><a href="/gestao/empreendimentos">Empreendimentos</a><a class="active" href="/gestao/construtoras">Construtoras</a><a href="/empreendimentos.html">Voltar ao NEXUM</a></nav></div></header>
  <main class="gestao-shell"><section class="management-page-heading"><div><span>GESTÃO DA BASE</span><h1>Construtoras</h1><p>Referência consolidada a partir dos empreendimentos já cadastrados.</p></div></section><section class="gestao-filter-bar one-field"><label>BUSCA<input id="search" type="search" placeholder="Nome da construtora"></label></section><section class="management-enterprise-list" id="rows"><div class="loading">Carregando construtoras…</div></section></main>
  <script src="/auth.js"></script><script>
    requireCTIUser(['ADMIN']);const $=selector=>document.querySelector(selector),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let builders=[];function render(){const term=$('#search').value.trim().toLocaleLowerCase('pt-BR'),rows=builders.filter(item=>!term||item.nome.toLocaleLowerCase('pt-BR').includes(term));$('#rows').innerHTML=rows.length?rows.map(item=>`<article class="management-enterprise-row"><div><strong>${esc(item.nome)}</strong><span>${item.empreendimentos.length} empreendimento(s)</span></div><div class="builder-enterprises">${item.empreendimentos.map(enterprise=>`<a href="/gestao/empreendimento?id=${encodeURIComponent(enterprise.id)}">${esc(enterprise.nome)}</a>`).join('')}</div></article>`).join(''):'<div class="management-empty">Nenhuma construtora encontrada.</div>'}fetch('/api/empreendimentos').then(response=>response.json()).then(data=>{const grouped=new Map;data.forEach(item=>{const name=String(item.construtora||'Não informada').trim();if(!grouped.has(name))grouped.set(name,[]);grouped.get(name).push({id:item.id,nome:item.nome})});builders=[...grouped].map(([nome,empreendimentos])=>({nome,empreendimentos})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));render()});$('#search').addEventListener('input',render);
  </script>
</body></html>
