<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM · Gestão de Empreendimentos</title><link rel="stylesheet" href="/nexo.css"></head>
<body class="gestao-page management-admin-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="/gestao"><img src="/logo/logo_branca.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav" data-nexum-header="ready"><a href="/gestao">Visão Geral</a><a href="/gestao/checklist">Checklist</a><a href="/gestao/tabelas">Tabelas Cadastradas</a><a href="/gestao/atualizacao-automatica">Atualização Automática</a><a class="active" href="/gestao/empreendimentos">Empreendimentos</a><a href="/gestao/construtoras">Construtoras</a><a href="/empreendimentos.html">Voltar ao NEXUM</a></nav></div></header>
  <main class="gestao-shell"><section class="management-page-heading"><div><span>GESTÃO DA BASE</span><h1>Empreendimentos</h1><p>Cadastro, edição e manutenção estrutural concentrados na área administrativa.</p></div><a class="button teal" href="/gestao/empreendimento?novo=1">+ Novo empreendimento</a></section><section class="gestao-filter-bar management-enterprise-filters"><label>BUSCA<input id="search" type="search" placeholder="Empreendimento, construtora ou bairro"></label><label>TIPO<select id="type"><option value="">Todos</option></select></label><label>STATUS<select id="phase"><option value="">Todos</option><option>Lançamento</option><option>Novo</option><option>Entregue</option></select></label></section><section class="management-enterprise-list" id="rows"><div class="loading">Carregando empreendimentos…</div></section></main><section id="nexum-home-floating-actions" class="gestao-floating-actions" aria-label="Ações da Gestão"><a class="nexum-enterprise-add-trigger nexum-floating-action" href="/gestao/empreendimento?novo=1" aria-label="Cadastrar novo empreendimento" title="Cadastrar novo empreendimento">+</a></section>
  <script src="/auth.js"></script><script>
    requireCTIUser(['ADMIN']);
    const $=selector=>document.querySelector(selector),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));let records=[];
    function render(){const term=$('#search').value.trim().toLocaleLowerCase('pt-BR'),type=$('#type').value,phase=$('#phase').value,rows=records.filter(item=>(!term||`${item.nome} ${item.construtora} ${item.bairro}`.toLocaleLowerCase('pt-BR').includes(term))&&(!type||item.tipo===type)&&(!phase||item.fase===phase));$('#rows').innerHTML=rows.length?rows.map(item=>`<article class="management-enterprise-row"><div><strong>${esc(item.nome)}</strong><span>${esc(item.construtora||'Construtora não informada')} · ${esc(item.bairro||'Bairro não informado')}</span></div><div><span>${esc(item.tipo||'Outro')}</span><small>${item.tableCount||0} tabela(s)</small></div><a class="button ghost" href="/gestao/empreendimento?id=${encodeURIComponent(item.id)}">Administrar</a></article>`).join(''):'<div class="management-empty">Nenhum empreendimento encontrado.</div>'}
    fetch('/api/empreendimentos').then(response=>response.json()).then(data=>{records=data;$('#type').innerHTML+=[...new Set(data.map(item=>item.tipo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(value=>`<option>${esc(value)}</option>`).join('');render()});['search','type','phase'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));
  </script>
</body></html>
