<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM · Tabelas cadastradas</title><link rel="stylesheet" href="/nexo.css"></head><body class="gestao-page management-admin-page"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/gestao"><img src="/logo/logo_branca.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav" data-nexum-header="ready"><a href="/gestao">Visão Geral</a><a href="/gestao/checklist">Checklist</a><a class="active" href="/gestao/tabelas">Tabelas Cadastradas</a><a href="/gestao/atualizacao-automatica">Atualização Automática</a><a href="/gestao/empreendimentos">Empreendimentos</a><a href="/gestao/construtoras">Construtoras</a><a href="/empreendimentos.html">Voltar ao NEXUM</a></nav></div></header><main class="gestao-shell"><section class="management-page-heading"><div><span>GESTÃO DA BASE</span><h1>Tabelas cadastradas</h1><p>Vigência documental e atualização operacional em uma visão consolidada.</p></div></section><section class="gestao-table-card"><div class="gestao-table-scroll"><table class="management-registered-tables"><thead><tr><th>Empreendimento</th><th>Modalidade</th><th>Vigência</th><th>Última atualização</th><th>Responsável</th><th>Próxima revisão</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/auth.js"></script><script>requireCTIUser(['ADMIN']);const d=value=>value?new Date(value).toLocaleString('pt-BR'):'—',esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));fetch('/api/gestao/tabelas').then(response=>response.json()).then(({rows})=>document.querySelector('#rows').innerHTML=rows.length?rows.map(row=>`<tr><td><strong>${esc(row.empreendimento)}</strong><small>${esc(row.construtora)}</small></td><td>${esc(row.modalidade)}</td><td>${d(row.vigencia)}</td><td>${d(row.ultimaAtualizacao)}</td><td>${esc(row.atualizadoPor?.nome||'—')}</td><td>${d(row.proximaRevisao)}</td><td><a class="button ghost" href="/gestao/empreendimento?id=${encodeURIComponent(row.empreendimentoId)}">Abrir</a></td></tr>`).join(''):'<tr><td colspan="7" class="management-empty">Nenhuma tabela cadastrada.</td></tr>')</script></body></html>
