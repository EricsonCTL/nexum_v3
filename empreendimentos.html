<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM Radar Imobiliário · Início</title><link rel="stylesheet" href="nexo.css"></head>
<body class="home-page">
<header class="topbar"><div class="topbar-inner"><a class="brand" href="empreendimentos.html"><img src="logo/logo_branca.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav"><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa Radar</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header>
<main class="shell portfolio-shell"><section class="portfolio-grid" id="list"><div class="loading">Carregando empreendimentos…</div></section></main>
<script src="auth.js"></script>
<script>
const user=requireCTIUser(['ADMIN','BROKER']);
const api=(url,opt)=>fetch(url,opt).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível concluir a operação.');return d});
let records=[];let selectedEnterpriseId=new URLSearchParams(location.search).get('empreendimento');
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const cover=e=>e.imagem?.path?`<figure class="enterprise-cover enterprise-cover-card"><img src="/${escape(e.imagem.path)}" alt="Imagem de ${escape(e.nome)}"></figure>`:`<div class="enterprise-cover enterprise-cover-card enterprise-cover-empty"><span>Imagem do empreendimento</span></div>`;
function render(){const rows=records.filter(e=>!selectedEnterpriseId||e.id===selectedEnterpriseId);document.getElementById('list').innerHTML=rows.length?rows.map(e=>`<article class="card emp-card">${cover(e)}<div class="emp-card-body"><div class="tags"><span class="tag">${escape(e.tipo)}</span><span class="tag gray">${escape(e.padrao)}</span></div><h2>${escape(e.nome)}</h2><p class="meta">${escape([e.bairro,e.cidade,e.estado].filter(Boolean).join(' · ')||'Localização não informada')}</p><div class="meta">${e.tableCount} tabela${e.tableCount===1?'':'s'} · ${e.latestTable?`última versão: ${date(e.latestTable.validityDate)}`:'nenhuma versão comercial'}</div><div class="actions"><a class="button ghost" href="radar.html?id=${encodeURIComponent(e.id)}">Radar</a><a class="button primary" href="empreendimento.html?id=${encodeURIComponent(e.id)}">Abrir cadastro</a></div></div></article>`).join(''):'<div class="empty">Nenhum empreendimento encontrado.</div>'}
async function load(){try{records=await api('/api/empreendimentos');render()}catch(e){document.getElementById('list').innerHTML=`<div class="error">${escape(e.message)}. Inicie o sistema com <strong>npm start</strong>.</div>`}}
window.addEventListener('nexum:filter-enterprise',event=>{selectedEnterpriseId=event.detail.id;history.replaceState(null,'',`empreendimentos.html?empreendimento=${encodeURIComponent(selectedEnterpriseId)}`);render()});load();
</script>
</body></html>
