<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM Radar Imobiliário · Empreendimentos</title><link rel="stylesheet" href="nexo.css"></head>
<body class="home-page">
<header class="topbar"><div class="topbar-inner"><a class="brand" href="empreendimentos.html"><img src="logo/logo_branca.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav"><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa Radar</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header>
<main class="shell"><div class="page-head"><div><div class="eyebrow">Módulo 01 · Aquisição e histórico</div><h1>Empreendimentos</h1><p>Cadastre a origem dos dados antes de importar versões comerciais. Cada tabela permanece vinculada ao PDF que a gerou.</p></div><a class="button teal" id="new-button" href="empreendimento.html?novo=1">+ Novo empreendimento</a></div><section class="metrics" id="metrics"><div class="metric"><strong>—</strong><span>Carregando</span></div></section><section class="card section"><div class="toolbar"><input id="search" type="search" placeholder="Buscar por nome, cidade ou bairro"><select id="status"><option value="">Todos os status</option><option value="active">Ativo</option></select></div><div class="grid" id="list"><div class="loading">Carregando empreendimentos…</div></div></section></main>
<script src="auth.js"></script>
<script>
const user=requireCTIUser(['ADMIN','BROKER']);
if(user?.role==='BROKER')document.getElementById('new-button').classList.add('hidden');
const api=(url,opt)=>fetch(url,opt).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível concluir a operação.');return d});
let records=[];
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const cover=e=>e.imagem?.path?`<figure class="enterprise-cover enterprise-cover-card"><img src="/${escape(e.imagem.path)}" alt="Imagem de ${escape(e.nome)}"></figure>`:`<div class="enterprise-cover enterprise-cover-card enterprise-cover-empty"><span>Imagem do empreendimento</span></div>`;
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const rows=records.filter(e=>`${e.nome} ${e.cidade} ${e.bairro}`.toLowerCase().includes(q));
  const totalTables=records.reduce((n,e)=>n+e.tableCount,0);
  document.getElementById('metrics').innerHTML=`<div class="metric"><strong>${records.length}</strong><span>Empreendimentos</span></div><div class="metric"><strong>${totalTables}</strong><span>Tabelas históricas</span></div><div class="metric"><strong>${records.filter(e=>e.latestTable?.status==='pending_validation').length}</strong><span>Aguardando validação</span></div><div class="metric"><strong>${records.filter(e=>e.tableCount===0).length}</strong><span>Sem tabela</span></div>`;
  document.getElementById('list').innerHTML=rows.length?rows.map(e=>`<article class="card emp-card">${cover(e)}<div class="emp-card-body"><div class="tags"><span class="tag">${escape(e.tipo)}</span><span class="tag gray">${escape(e.padrao)}</span></div><h2>${escape(e.nome)}</h2><p class="meta">${escape([e.bairro,e.cidade,e.estado].filter(Boolean).join(' · ')||'Localização não informada')}</p><div class="meta">${e.tableCount} tabela${e.tableCount===1?'':'s'} · ${e.latestTable?`última versão: ${date(e.latestTable.validityDate)}`:'nenhuma versão comercial'}</div><div class="actions"><a class="button ghost" href="radar.html?id=${encodeURIComponent(e.id)}">Radar</a><a class="button primary" href="empreendimento.html?id=${encodeURIComponent(e.id)}">Abrir cadastro</a></div></div></article>`).join(''):'<div class="empty">Nenhum empreendimento encontrado.</div>';
}
async function load(){try{records=await api('/api/empreendimentos');render()}catch(e){document.getElementById('list').innerHTML=`<div class="error">${escape(e.message)}. Inicie o sistema com <strong>npm start</strong>.</div>`}}
document.getElementById('search').addEventListener('input',render);load();
</script>
</body></html>
