<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Radar Imobiliário · Radar</title><link rel="stylesheet" href="nexo.css"></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="empreendimentos.html"><img src="logo/ChatGPT%20Image%2013%20de%20ago.%20de%202026,%2011_38_17.png" alt="Nexo Radar Imobiliário"></a><nav class="nav"><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa Radar</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header><main class="shell" id="app"><div class="loading">Calculando o radar…</div></main>
<script src="auth.js"></script><script>
requireCTIUser(['ADMIN']);
const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app'); let radar=null;
const api=async(url,opt={})=>{const res=await fetch(url,opt);const data=await res.json();if(!res.ok)throw new Error(data.error||'Não foi possível concluir a operação.');return data};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}); const number=v=>Number(v||0).toLocaleString('pt-BR'); const pct=v=>v==null?'—':`${v>=0?'+':''}${(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%`; const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—'; const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusText={PENDENTE:'Pendente',VENDIDA:'Vendida',INDISPONIVEL:'Indisponível',RESERVADA:'Reservada',RETIRADA_COMERCIALIZACAO:'Retirada de comercialização',OUTRA:'Outra'};
const metric=(value,label,style='')=>`<article class="metric ${style}"><strong>${value}</strong><span>${label}</span></article>`;
function graph(timeline){if(timeline.length<2)return '<div class="empty">Uma nova versão habilita a evolução temporal.</div>';const values=timeline.map(item=>item.vgv),max=Math.max(...values),min=Math.min(...values),range=max-min||1,points=values.map((value,index)=>`${20+index*(340/(values.length-1))},${180-((value-min)/range)*135}`).join(' ');return `<div class="chart"><svg viewBox="0 0 380 205"><line x1="20" y1="180" x2="360" y2="180" stroke="#dce5ef"/><line x1="20" y1="45" x2="360" y2="45" stroke="#dce5ef" stroke-dasharray="4 4"/><polyline fill="none" stroke="#0bb39b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${points}"/>${values.map((value,index)=>{const [x,y]=points.split(' ')[index].split(',');return `<circle cx="${x}" cy="${y}" r="5" fill="#031d49"><title>${money(value)}</title></circle>`}).join('')}</svg></div><div class="chart-labels">${timeline.map(item=>`<span>${date(item.validityDate)}</span>`).join('')}</div>`}
function removalsPanel(r){const rows=r.removedDetails||[];if(!rows.length)return '<section class="card section" style="margin-top:16px"><h2 class="panel-title">Classificação de saídas</h2><p class="panel-subtitle">Nenhuma unidade saiu da tabela neste período.</p></section>';return `<section class="card section" style="margin-top:16px"><div class="page-head" style="margin:0 0 16px"><div><h2 class="panel-title">Classificação de saídas da tabela</h2><p class="panel-subtitle">Defina o que ocorreu com cada unidade. Apenas “Vendida” entra no indicador de vendas confirmadas.</p></div><button class="button teal" id="save-removals">Salvar classificações</button></div><div id="removal-message" class="hidden"></div><div class="table-wrap"><table><thead><tr><th>Bloco</th><th>Unidade</th><th class="num">Último valor</th><th>Classificação</th><th>Observação</th></tr></thead><tbody>${rows.map((item,index)=>`<tr><td>${esc(item.bloco)}<input type="hidden" name="key_${index}" value="${esc(item.chave)}"></td><td><strong>${esc(item.unidade)}</strong><br><span class="meta">${esc(item.situacaoAnterior)}</span></td><td class="num">${money(item.valor)}</td><td><select name="status_${index}">${Object.entries(statusText).map(([key,label])=>`<option value="${key}" ${item.classificacao===key?'selected':''}>${label}</option>`).join('')}</select></td><td><input name="note_${index}" value="${esc(item.observacao)}" placeholder="Opcional"></td></tr>`).join('')}</tbody></table></div><p class="meta" style="margin:12px 0 0">Pendente significa: a unidade desapareceu da tabela, mas o fato operacional ainda não foi confirmado.</p></section>`}
function render(r){radar=r;const saleSignal=r.comparison.removed,removals=r.comparison.removals;app.innerHTML=`<section class="radar-hero"><div class="eyebrow">Radar operacional · ${esc(r.id)}</div><h1>${esc(r.nome)}</h1><p>${esc([r.endereco,r.numero,r.bairro,r.cidade,r.estado].filter(Boolean).join(' · '))}</p></section><div class="page-head"><div><div class="eyebrow">Visão entre versões</div><h1>O que mudou no período</h1><p>${r.previousTable?`${esc(r.previousTable.name)} (${date(r.previousTable.validityDate)}) → ${esc(r.latestTable.name)} (${date(r.latestTable.validityDate)})`:'Cadastre uma segunda tabela do mesmo tipo para comparar períodos.'}</p></div><div class="actions"><a class="button ghost" href="analise.html?id=${encodeURIComponent(r.id)}">Unidades</a><a class="button ghost" href="simulador.html?id=${encodeURIComponent(r.id)}">Simular</a><a class="button ghost" href="empreendimento.html?id=${encodeURIComponent(r.id)}">Abrir cadastro</a></div></div><section class="metrics">${metric(number(r.current.units),'Unidades na tabela atual','accent')}${metric(money(r.current.vgv),'VGV em tabela atual')}${metric(number(removals.pendentes),'Saídas pendentes de decisão',removals.pendentes?'negative':'')}${metric(number(removals.vendidas),'Vendas confirmadas','positive')}</section><section class="two-col"><article class="card section"><h2 class="panel-title">Evolução do VGV em tabela</h2><p class="panel-subtitle">VGV das unidades presentes em cada versão. Redução pode resultar de saídas, não de desconto.</p>${graph(r.timeline)}</article><article class="card section"><h2 class="panel-title">Leitura executiva</h2><p class="panel-subtitle">Diagnóstico calculado a partir das versões confirmadas.</p><div class="insight-list"><div><span>Unidades mantidas</span><strong>${number(r.comparison.retained)}</strong></div><div><span>Entradas na nova tabela</span><strong>${number(r.comparison.added)}</strong></div><div><span>Saídas da tabela</span><strong>${number(r.comparison.removed)}</strong></div><div><span>Preço por m² atual</span><strong>${r.current.pricePerM2?money(r.current.pricePerM2):'—'}</strong></div><div><span>Ticket médio atual</span><strong>${money(r.current.averagePrice)}</strong></div><div><span>Variações de preço</span><strong>${number(r.comparison.priceChanged)} ↑ ${number(r.comparison.priceIncrease)} · ↓ ${number(r.comparison.priceDecrease)}</strong></div></div></article></section><section class="two-col"><article class="card section"><h2 class="panel-title">VGV por bloco</h2><p class="panel-subtitle">Estoque atual, vendas confirmadas e VGV por bloco/torre.</p><div class="table-wrap"><table><thead><tr><th>Bloco</th><th class="num">Unid. atuais</th><th class="num">VGV atual</th><th class="num">Vendidas</th><th class="num">Pendentes</th></tr></thead><tbody>${r.byBlock.map(item=>`<tr><td><strong>${esc(item.block)}</strong></td><td class="num">${number(item.current.units)}</td><td class="num">${money(item.current.vgv)}</td><td class="num">${number(item.comparison.salesConfirmed)}</td><td class="num">${number(item.comparison.removedPending)}</td></tr>`).join('')}</tbody></table></div></article><article class="card section"><h2 class="panel-title">Qualidade do dado</h2><p class="panel-subtitle">O que é cálculo automático e o que ainda exige decisão humana.</p><div class="insight-list"><div><span>Versões históricas</span><strong>${number(r.tableCount)}</strong></div><div><span>Unidades com preço atual</span><strong>${number(r.current.pricedUnits)} / ${number(r.current.units)}</strong></div><div><span>VGV potencial das saídas</span><strong>${money(r.comparison.removedVgv)}</strong></div><div><span>Vendas confirmadas</span><strong>${number(removals.vendidas)}</strong></div><div><span>Classificações pendentes</span><strong>${number(removals.pendentes)}</strong></div></div></article></section>${removalsPanel(r)}<section class="card section" style="margin-top:16px"><h2 class="panel-title">Histórico de versões</h2><div class="table-wrap"><table><thead><tr><th>Validade</th><th>Tabela</th><th class="num">Unidades</th><th class="num">VGV em tabela</th><th class="num">Preço/m²</th><th class="num">Saídas vs. anterior</th></tr></thead><tbody>${r.timeline.map(item=>`<tr><td>${date(item.validityDate)}</td><td>${esc(item.name)}</td><td class="num">${number(item.units)}</td><td class="num">${money(item.vgv)}</td><td class="num">${item.pricePerM2?money(item.pricePerM2):'—'}</td><td class="num">${item.comparison?number(item.comparison.removed):'—'}</td></tr>`).join('')}</tbody></table></div></section>`;bindRemovalForm()}
function blockBars(rows){const max=Math.max(...rows.map(item=>Number(item.current?.vgv||0)),1);return `<div class="rank-bars" aria-label="Ranking de VGV por bloco">${rows.slice().sort((a,b)=>Number(b.current?.vgv||0)-Number(a.current?.vgv||0)).map(item=>`<div class="rank-bar"><span title="${esc(item.block)}">${esc(item.block)}</span><i><b style="width:${Number(item.current?.vgv||0)/max*100}%"></b></i><strong>${money(item.current?.vgv||0)}</strong></div>`).join('')}</div>`}
function injectBlockBars(r){const title=[...document.querySelectorAll('.panel-title')].find(node=>node.textContent.trim()==='VGV por bloco');const card=title?.closest('.card');const table=card?.querySelector('.table-wrap');if(table&&!card.querySelector('.rank-bars'))table.insertAdjacentHTML('beforebegin',blockBars(r.byBlock||[]));}
const renderBase=render; render=function(r){renderBase(r);injectBlockBars(r);if(r.comparison.returned){app.insertAdjacentHTML('beforeend',`<section class="notice" style="margin-top:16px"><strong>${number(r.comparison.returned)} unidade(s) retornaram à tabela.</strong> Elas haviam saído em uma versão anterior e reapareceram agora.</section>`);}};
function bindRemovalForm(){const button=document.getElementById('save-removals');if(!button)return;button.onclick=async()=>{const rows=radar.removedDetails||[];const list=rows.map((item,index)=>({chave:document.querySelector(`[name="key_${index}"]`).value,status:document.querySelector(`[name="status_${index}"]`).value,observacao:document.querySelector(`[name="note_${index}"]`).value}));button.disabled=true;button.textContent='Salvando…';try{await api(`/api/empreendimentos/${encodeURIComponent(id)}/tabelas/${encodeURIComponent(radar.latestTable.id)}/classificar-removidas`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classificacoes:list})});await load()}catch(error){const box=document.getElementById('removal-message');box.className='error';box.textContent=error.message;button.disabled=false;button.textContent='Salvar classificações'}}}
async function load(){try{render(await api(`/api/empreendimentos/${encodeURIComponent(id)}/radar`))}catch(error){app.innerHTML=`<div class="error">${esc(error.message)}</div>`}}if(!id)app.innerHTML='<div class="error">Selecione um empreendimento pelo cadastro.</div>';else load();
const renderWithInventoryStatus=render;render=function(r){renderWithInventoryStatus(r);const metrics=app.querySelector('.metrics');if(metrics)metrics.innerHTML=`${metric(number(r.current.units),'Total de unidades cadastradas','accent')}${metric(number(r.current.available),'Unidades disponíveis','positive')}${metric(number(r.current.newAvailable),'Novas unidades disponíveis',r.current.newAvailable?'negative':'')}${metric(number(r.current.sold),'Unidades vendidas','negative')}`;const hero=app.querySelector('.radar-hero');if(hero){const image=r.imagem?.path?`<figure class="radar-hero-cover"><img src="/${esc(r.imagem.path)}" alt="Imagem de ${esc(r.nome)}"></figure>`:'';hero.innerHTML=`<div class="radar-hero-content"><div class="eyebrow">Radar operacional · ${esc(r.id)}</div><h1>${esc(r.nome)}</h1><p>${esc([r.endereco,r.numero,r.bairro,r.cidade,r.estado].filter(Boolean).join(' · '))}</p></div>${image}`;hero.classList.toggle('has-cover',Boolean(image))}};if(id)load();
</script></body></html>
