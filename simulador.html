<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUM · Simulador</title><link rel="stylesheet" href="nexo.css"></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="inicio.html"><img src="logo/ChatGPT%20Image%2013%20de%20ago.%20de%202026,%2011_38_17.png" alt="NEXUM Radar Imobiliário"></a><nav class="nav"><a href="inicio.html">Início</a><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa</a><a href="analytics.html">Analytics</a><a href="rede-mercados.html">Rede</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header>
<main class="shell" id="app"><div class="loading">Preparando simulador…</div></main>
<script src="auth.js"></script><script>
requireCTIUser(['ADMIN','BROKER']);
const query=new URLSearchParams(location.search),id=query.get('id'),app=document.getElementById('app');
let context=null,tableId=query.get('tabela')||'',unitId=query.get('unidade')||'',modalityId=query.get('modalidade')||'',planCode=query.get('plano')||'';
const api=async url=>{const response=await fetch(url),data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível concluir a operação.');return data};
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[char]));
const money=value=>Number(value||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),unitValue=unit=>Number(unit?.valorValidado??unit?.valorInterpretado??unit?.valorExtraido??0);
function current(){
  const table=context?.tabela,units=context?.unidades||[],modalities=context?.modalidades||[],modality=modalities.find(item=>item.id===(context?.modalidade?.id||modalityId))||modalities[0],versions=modality?.versoes||[];
  if(!unitId||!units.some(unit=>unit.id===unitId))unitId=units.find(unit=>/dispon/i.test(unit.situacaoExtraida||''))?.id||units[0]?.id||'';
  const plans=table?.regraInterpretada?.planos||[];if(!planCode||!plans.some(plan=>plan.codigo===planCode))planCode=context?.plano?.codigo||plans[0]?.codigo||'';
  return{table,units,unit:units.find(item=>item.id===unitId),modalities,modality,versions,plans,plan:plans.find(item=>item.codigo===planCode)};
}
function publishedPlan(unit,code){const found=(unit?.condicoes?.planos||[]).find(plan=>plan.codigo===code);if(found)return found;const derived=unit?.valoresDerivadosComerciais?.[code];if(derived)return{codigo:code,conciliacao:derived};const c=unit?.condicoes||{};return code==='PLANO_PADRAO'&&(c.sinal||c.parcelas||c.intercaladas||c.chave)?{codigo:code,conciliacao:c.conciliacao}:null}
function reconciliation(unit,code){return publishedPlan(unit,code)?.conciliacao||null}
function componentField(component,derived){const editable=component.natureza==='minima',quantity=Number(component.quantidade||1)||1,type=component.tipoCalculo||(component.tipo==='saldo'?'residual':component.tipo),base=component.baseCalculo||component.base;return`<div class="field"><label for="component-${esc(component.id)}">${esc(component.nome)}${component.natureza==='minima'?' mínima':''}${quantity>1?` · ${quantity}×`:''}</label><input id="component-${esc(component.id)}" data-component="${esc(component.id)}" type="number" min="${editable?Number(derived?.valor||0).toFixed(2):0}" step="0.01" value="${Number(derived?.valor||0).toFixed(2)}" ${editable?'':'readonly'}><div class="field-help">${esc(type)} · base ${esc(base)} · ${esc(component.natureza)}${editable?' · pode aumentar, nunca diminuir':' · condição preservada'}</div></div>`}
function publishedRows(plan,derived){return(plan?.componentes||[]).map(component=>{const item=derived.get(component.id),quantity=Number(item?.quantidade||component.quantidade||1)||1;return`<tr><td>${esc(component.nome)}</td><td>${quantity>1?`${quantity}× de ${money(item?.valor||0)}`:money(item?.total||0)}</td><td data-proposed-row="${esc(component.id)}">—</td></tr>`}).join('')}
function render(){
  const{table,units,unit,modalities,modality,versions,plans,plan}=current();if(!table||!unit){app.innerHTML='<div class="empty"><h2>Não há condição comercial disponível.</h2><p>Confirme uma fotografia com unidades e modalidade.</p></div>';return}
  const rule=table.regraInterpretada||{},check=reconciliation(unit,planCode),derived=new Map((check?.valoresDerivados||[]).map(item=>[item.id,item])),active=Boolean(context.calculavel&&check?.status==='conforme'),informative=Boolean(context.informativo);
  app.innerHTML=`<div class="page-head"><div><div class="eyebrow">Simulador comercial</div><h1>${esc(context.empreendimento.nome)}</h1><p>Unidade + modalidade + versão + plano. O publicado nunca é sobrescrito.</p></div><a class="button ghost" href="analise.html?id=${encodeURIComponent(id)}">← Tabela Geral</a></div><section class="card section sim-selector commercial-sim-selector"><div class="field"><label for="unit">Unidade</label><select id="unit">${units.map(item=>`<option value="${esc(item.id)}" ${item.id===unitId?'selected':''}>${esc(item.quadra)} · ${esc(item.unidade)} · ${money(unitValue(item))}</option>`).join('')}</select></div><div class="field"><label for="modality">Modalidade</label><select id="modality">${modalities.map(item=>`<option value="${esc(item.id)}" ${item.id===modality?.id?'selected':''}>${esc(item.label)}</option>`).join('')}</select></div><div class="field"><label for="version">Versão</label><select id="version">${versions.map(item=>`<option value="${esc(item.id)}" ${item.id===table.id?'selected':''}>${esc(item.name)} · ${new Date(item.validityDate+'T12:00:00').toLocaleDateString('pt-BR')}</option>`).join('')}</select></div><div class="field"><label for="plan">Plano</label><select id="plan" ${plans.length?'':'disabled'}>${plans.map(item=>`<option value="${esc(item.codigo)}" ${item.codigo===planCode?'selected':''}>${esc(item.nome)}</option>`).join('')||'<option>Condição publicada</option>'}</select></div></section><section class="sim-layout"><article class="card section"><div class="section-title"><div><span class="eyebrow">${informative?'Condição informativa':'Condição proposta'}</span><h2>${esc(unit.quadra)} · unidade ${esc(unit.unidade)}</h2><p>${esc(table.tipoTabelaLabel)} · ${esc(table.name)}</p></div><span class="tag ${active||informative?'':'warn'}">${informative?'Consulta bancária':active?'Validada automaticamente':'Bloqueada'}</span></div><div class="sim-price">${money(unitValue(unit))}<span>Valor do imóvel publicado</span></div>${informative?'<div class="notice"><strong>Modalidade bancária.</strong> O Nexum preserva a condição publicada, mas não calcula prestação: taxa, prazo, renda e sistema de amortização dependem da instituição financeira.</div>':!active?'<div class="notice error">Esta combinação possui divergência, ambiguidade ou não está conciliada. A proposta não será calculada.</div>':`<div class="notice"><strong>${esc(rule.modalidade?.nome||table.tipoTabelaLabel)} · ${esc(plan.nome)}.</strong> Componentes mínimos podem aumentar; os dependentes recompõem o saldo.</div><div class="form-grid sim-fields">${(plan.componentes||[]).filter(component=>component.id!=='mensais'&&component.id!=='valor_a_vista').map(component=>componentField(component,derived.get(component.id))).join('')}</div>`}</article><aside class="card section sim-result commercial-comparison"><h2>Publicado × Proposto</h2>${plan?`<div class="sim-comparison-wrap"><table><thead><tr><th>Componente</th><th>Publicado</th><th>Proposto</th></tr></thead><tbody>${publishedRows(plan,derived)}</tbody><tfoot><tr><th>Total</th><th>${money(check?.valorComercial??check?.declaradoTotal??unitValue(unit))}</th><th id="proposed-total">${informative?'Não calculado':'—'}</th></tr></tfoot></table></div>`:'<p class="muted">Esta modalidade não publicou componentes estruturados.</p>'}<p id="warning" class="error hidden"></p><button class="button teal" id="copy">Copiar resumo</button></aside></section>`;
  document.getElementById('unit').onchange=event=>{unitId=event.target.value;render()};document.getElementById('modality').onchange=event=>{modalityId=event.target.value;tableId='';unitId='';planCode='';load()};document.getElementById('version').onchange=event=>{tableId=event.target.value;unitId='';planCode='';load()};document.getElementById('plan').onchange=event=>{planCode=event.target.value;render()};if(active){document.querySelectorAll('[data-component]').forEach(node=>node.oninput=calculate);calculate()}document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(document.querySelector('.commercial-comparison').innerText);document.getElementById('copy').textContent='Resumo copiado'};
}
function calculate(){const{unit,plan}=current(),check=reconciliation(unit,planCode),derived=new Map((check?.valoresDerivados||[]).map(item=>[item.id,item])),price=unitValue(unit);let paid=0,invalid=false;if((plan.componentes||[]).some(component=>component.efeito==='desconto')){for(const component of plan.componentes||[]){const item=derived.get(component.id),cell=document.querySelector(`[data-proposed-row="${CSS.escape(component.id)}"]`);if(cell&&item)cell.textContent=money(item.total)}document.getElementById('proposed-total').textContent=money(check?.valorComercial||0);return}for(const component of(plan.componentes||[]).filter(item=>item.id!=='mensais')){const baseline=derived.get(component.id)||{valor:0,quantidade:component.quantidade||1},input=document.querySelector(`[data-component="${CSS.escape(component.id)}"]`),per=Number(input?.value??baseline.valor),qty=Number(component.quantidade||baseline.quantidade||1)||1;if(component.natureza==='minima'&&per+0.005<Number(baseline.valor||0))invalid=true;if(component.natureza==='fixa'&&Math.abs(per-Number(baseline.valor||0))>0.005)invalid=true;const total=per*qty;paid+=total;const cell=document.querySelector(`[data-proposed-row="${CSS.escape(component.id)}"]`);if(cell)cell.textContent=qty>1?`${qty}× de ${money(per)}`:money(total)}const monthlyRule=(plan.componentes||[]).find(item=>item.id==='mensais'),months=Number(monthlyRule?.quantidade||plan.prazoMeses||0),balance=price-paid,monthly=months?balance/months:0;if(balance<-.01||months<1)invalid=true;const cell=document.querySelector('[data-proposed-row="mensais"]');if(cell)cell.textContent=`${months}× de ${money(Math.max(0,monthly))}`;const total=paid+Math.max(0,balance);if(Math.abs(price-total)>.02)invalid=true;document.getElementById('proposed-total').textContent=money(total);const warning=document.getElementById('warning');warning.classList.toggle('hidden',!invalid);warning.textContent=invalid?'A proposta viola um mínimo, altera um componente fixo ou não fecha com o valor do imóvel.':''}
async function load(){if(!id){app.innerHTML='<div class="error">Selecione um empreendimento.</div>';return}try{const params=new URLSearchParams();if(modalityId)params.set('modalidade',modalityId);if(tableId)params.set('tabela',tableId);if(planCode)params.set('plano',planCode);context=await api(`/api/empreendimentos/${encodeURIComponent(id)}/simulacao-contexto?${params}`);modalityId=context.modalidade?.id||'';tableId=context.tabela?.id||'';planCode=context.plano?.codigo||context.tabela?.regraInterpretada?.planos?.[0]?.codigo||'';render()}catch(error){app.innerHTML=`<div class="error">${esc(error.message)}</div>`}}
load();
</script></body></html>
