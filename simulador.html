<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Radar · Simulador</title><link rel="stylesheet" href="nexo.css"></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="empreendimentos.html"><img src="logo/ChatGPT%20Image%2013%20de%20ago.%20de%202026,%2011_38_17.png" alt="Nexo Radar Imobiliário"></a><nav class="nav"><a class="active" href="empreendimentos.html">Empreendimentos</a><a href="mapa.html">Mapa Radar</a><button type="button" onclick="logoutCTI()">Sair</button></nav></div></header>
<main class="shell" id="app"><div class="loading">Preparando simulador…</div></main>
<script src="auth.js"></script><script>
requireCTIUser(['ADMIN','BROKER']);const id=new URLSearchParams(location.search).get('id'),query=new URLSearchParams(location.search),app=document.getElementById('app');let emp=null,tableId=query.get('tabela')||'',unitId=query.get('unidade')||'',typeId=query.get('tipo')||'';
const api=async u=>{const r=await fetch(u);const d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível concluir a operação.');return d};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const value=u=>Number(u.valorValidado??u.valorInterpretado??u.valorExtraido??0);
function getScope(){const confirmed=(emp.tabelas||[]).filter(t=>t.status==='registered').sort((a,b)=>a.validityDate.localeCompare(b.validityDate));const types=[...new Map(confirmed.map(t=>[t.tipoTabela||'PADRAO',t.tipoTabelaLabel||'Padrão'])).entries()].map(([id,label])=>({id,label}));if(!typeId)typeId=types.at(-1)?.id||'';const scope=confirmed.filter(t=>(t.tipoTabela||'PADRAO')===typeId);if(!tableId||!scope.some(t=>t.id===tableId))tableId=scope.at(-1)?.id||'';const table=scope.find(t=>t.id===tableId);const units=table?.unidades||[];if(!unitId||!units.some(u=>u.id===unitId))unitId=units.find(u=>/dispon/i.test(u.situacaoExtraida||''))?.id||units[0]?.id||'';return {types,scope,table,units,unit:units.find(u=>u.id===unitId)};}
function field(name,label,value,type='number',step='0.01'){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" type="${type}" min="0" step="${step}" value="${value??''}"></div>`}
function render(){const {types,scope,table,units,unit}=getScope();if(!table||!unit){app.innerHTML='<div class="empty">Não há unidades confirmadas para simular.</div>';return}const c=unit.condicoes||{},hasRules=Object.keys(c).length>0;const entry=c.sinal?.valor??0,months=c.parcelas?.quantidade??0,interCount=c.intercaladas?.quantidade??0,interValue=c.intercaladas?.valor??0,keyValue=c.chave?.valor??0;app.innerHTML=`<div class="page-head"><div><div class="eyebrow">Simulador comercial</div><h1>${esc(emp.nome)}</h1><p>Escolha a modalidade, versão e unidade. A composição parte das regras normalizadas da tabela.</p></div><a class="button ghost" href="analise.html?id=${encodeURIComponent(id)}">← Unidades</a></div><section class="card section sim-selector"><div class="field ${types.length<2?'hidden':''}"><label for="type">Tipo de tabela</label><select id="type">${types.map(t=>`<option value="${esc(t.id)}" ${typeId===t.id?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div><div class="field"><label for="version">Versão comercial</label><select id="version">${scope.map(t=>`<option value="${esc(t.id)}" ${tableId===t.id?'selected':''}>${esc(t.name)} · ${new Date(t.validityDate+'T12:00:00').toLocaleDateString('pt-BR')}</option>`).join('')}</select></div><div class="field"><label for="unit">Unidade</label><select id="unit">${units.map(u=>`<option value="${esc(u.id)}" ${unitId===u.id?'selected':''}>${esc(u.quadra)} · ${esc(u.unidade)} · ${money(value(u))}</option>`).join('')}</select></div></section><section class="sim-layout"><article class="card section"><div class="section-title"><div><h2>${esc(unit.quadra)} · unidade ${esc(unit.unidade)}</h2><p>${unit.areaPrivativa?`${String(unit.areaPrivativa).replace('.',',')} m²`:''} ${unit.vagas!=null?`· ${unit.vagas} vaga(s)`:''}</p></div><span class="tag ${/dispon/i.test(unit.situacaoExtraida||'')?'':'gray'}">${esc(unit.situacaoExtraida||'Não identificado')}</span></div><div class="sim-price">${money(value(unit))}<span>Valor de tabela</span></div>${hasRules?`<div class="form-grid sim-fields">${field('entrada','Sinal / entrada (R$)',entry)}${field('meses','Quantidade de parcelas',months,'number','1')}${field('interQtd','Intercaladas',interCount,'number','1')}${field('interValor','Valor de cada intercalada (R$)',interValue)}${field('chave','Parcela na chave (R$)',keyValue)}</div><p class="meta">Referência original: sinal ${c.sinal?.percentual??'—'}% · parcelas ${c.parcelas?.percentual??'—'}% · intercaladas ${c.intercaladas?.percentual??'—'}% · chave ${c.chave?.percentual??'—'}%.</p>`:`<div class="notice">Esta tabela não possui composição por unidade estruturada. O simulador preserva o valor e as regras textuais, sem criar condições que não vieram da fonte.</div>`}<div class="notice" style="margin-top:16px"><strong>Regras da versão:</strong> ${esc(table.regrasComerciais||'Não informadas.')}</div></article><aside class="card section sim-result"><h2>Resumo da proposta</h2><div id="result"></div><p id="warning" class="error hidden"></p><button class="button teal" id="copy">Copiar resumo</button></aside></section>`;['type','version','unit'].forEach(name=>{const node=document.getElementById(name);if(node)node.onchange=e=>{if(name==='type'){typeId=e.target.value;tableId='';unitId=''}if(name==='version'){tableId=e.target.value;unitId=''}if(name==='unit')unitId=e.target.value;render()}});if(hasRules){['entrada','meses','interQtd','interValor','chave'].forEach(n=>document.getElementById(n).oninput=calculate);calculate()}else document.getElementById('result').innerHTML=`<div class="proposal-row"><span>Valor da unidade</span><strong>${money(value(unit))}</strong></div>`;document.getElementById('copy').onclick=async()=>{const text=document.getElementById('result').innerText;await navigator.clipboard.writeText(`${emp.nome}\n${unit.quadra} · ${unit.unidade}\n${text}`);document.getElementById('copy').textContent='Resumo copiado'};}
function calculate(){const price=value(getScope().unit),entry=Number(document.getElementById('entrada').value||0),months=Number(document.getElementById('meses').value||0),interQty=Number(document.getElementById('interQtd').value||0),interValue=Number(document.getElementById('interValor').value||0),keyValue=Number(document.getElementById('chave').value||0),balance=price-entry-(interQty*interValue)-keyValue,monthly=months>0?balance/months:0,invalid=balance<0||months<1;document.getElementById('result').innerHTML=`<div class="proposal-row"><span>Valor da unidade</span><strong>${money(price)}</strong></div><div class="proposal-row"><span>Entrada</span><strong>${money(entry)}</strong></div><div class="proposal-row"><span>Intercaladas</span><strong>${interQty}× de ${money(interValue)}</strong></div><div class="proposal-row"><span>Chave</span><strong>${money(keyValue)}</strong></div><div class="proposal-row total"><span>Parcela mensal</span><strong>${months}× de ${money(monthly)}</strong></div>`;const warn=document.getElementById('warning');warn.classList.toggle('hidden',!invalid);warn.textContent=invalid?'Revise a composição: o saldo não pode ser negativo e o prazo deve ser maior que zero.':'';}
(async()=>{if(!id){app.innerHTML='<div class="error">Selecione um empreendimento.</div>';return}try{emp=await api(`/api/empreendimentos/${encodeURIComponent(id)}`);render()}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`}})();
</script></body></html>
